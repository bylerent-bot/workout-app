<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>IRON CIRCUIT | Rest Timer</title><link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&amp;family=Press+Start+2P&amp;display=swap" rel="stylesheet"><style>
:root{--ink:#070a0c;--steel:#10161a;--raised:#182126;--line:#34434a;--fog:#8fa3aa;--white:#f4f7f2;--volt:#c7ff2e;--rage:#ff3b30;--ice:#49c6ff;--display:"Press Start 2P","Arial Black",sans-serif;--head:"Barlow Condensed",Impact,sans-serif;--body:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}*{box-sizing:border-box}body{margin:0;background:var(--ink);color:var(--white);font:16px var(--body);min-height:100vh;padding:max(12px,env(safe-area-inset-top)) 0 calc(72px + env(safe-area-inset-bottom))}.app{max-width:520px;margin:auto;padding:0 16px}.hud{font:10px/1.4 var(--display);color:var(--volt);padding:8px 0 18px;border-bottom:2px solid var(--line)}.faded{opacity:.38}.card{margin-top:18px;padding:18px;background:var(--steel);border:2px solid var(--line);box-shadow:5px 5px #000}.label{font:700 12px var(--head);letter-spacing:.12em;color:var(--fog)}h1{font:900 32px/1 var(--head);text-transform:uppercase;margin:8px 0}.set{display:flex;justify-content:space-between;border-top:2px solid var(--line);padding:14px 0;font:700 17px var(--head)}.set b{color:var(--volt)}.sheet{position:fixed;z-index:10;left:0;right:0;bottom:calc(72px + env(safe-area-inset-bottom));min-height:40vh;background:var(--steel);border-top:4px solid var(--rage);padding:20px max(16px,calc((100vw - 488px)/2));box-shadow:0 -12px 0 rgba(0,0,0,.35);overflow:hidden}.drain{position:absolute;left:0;top:0;height:8px;width:66%;background:var(--rage);transition:width 1s linear}.timerhead{display:flex;justify-content:space-between;align-items:center;position:relative}.timerhead b{color:var(--rage);font:700 13px var(--head);letter-spacing:.12em}.timerhead span{color:var(--fog);font:700 12px var(--head)}.digits{font:900 clamp(82px,28vw,124px)/.95 var(--head);font-variant-numeric:tabular-nums;letter-spacing:-.04em;margin:10px 0 4px;text-shadow:5px 5px 0 #000}.next{font:700 15px var(--head);letter-spacing:.06em;color:var(--fog);margin-bottom:18px}.next strong{color:var(--white)}.actions{display:grid;grid-template-columns:1fr 1fr;gap:12px}button{height:58px;background:var(--raised);color:var(--white);border:2px solid var(--line);box-shadow:4px 4px #000;font:900 18px var(--head);letter-spacing:.06em;cursor:pointer}button:active{transform:translate(2px,2px);box-shadow:1px 1px #000}button.primary{border-color:var(--rage);color:var(--rage)}.sheet.done{background:var(--volt);color:var(--ink);border-color:var(--volt)}.sheet.done .drain{display:none}.sheet.done .timerhead b,.sheet.done .next,.sheet.done .next strong{color:var(--ink)}.sheet.done button{background:var(--ink);color:var(--white)}.nav{position:fixed;left:0;right:0;bottom:0;height:calc(72px + env(safe-area-inset-bottom));padding-bottom:env(safe-area-inset-bottom);display:flex;background:var(--steel);border-top:2px solid var(--line)}.nav button{flex:1;height:auto;box-shadow:none;border:0;border-right:1px solid var(--line);font-size:12px;color:var(--fog)}.nav .active{background:var(--volt);color:var(--ink)}@media(prefers-reduced-motion:reduce){.drain{transition:none}}
</style></head><body><main class="app faded" aria-hidden="true"><div class="hud">IRON CIRCUIT · SESSION 014</div><div class="card"><div class="label">ROUND 3/5</div><h1>Incline DB Press</h1><div class="set"><span>SET 3 · 70 × 8</span><b>LOGGED ✓</b></div><div class="set"><span>SET 4</span><span>UP NEXT</span></div></div></main><section class="sheet" id="sheet" role="timer" aria-live="polite"><div class="drain" id="drain"></div><div class="timerhead"><b id="state">REST. DON'T WANDER.</b><span>90 SEC START</span></div><div class="digits" id="digits">1:00</div><div class="next">NEXT: <strong>SET 4 · 70 LB × 8</strong></div><div class="actions"><button class="primary" onclick="add30()">+30 SEC</button><button onclick="finish()">SKIP REST</button></div></section><nav class="nav"><button class="active">TRAIN</button><button>FUEL</button><button>RIVALRY</button><button>VAULT</button></nav><script>let seconds=60,total=90,run=true;const digits=document.getElementById('digits'),drain=document.getElementById('drain'),sheet=document.getElementById('sheet');function paint(){digits.textContent=Math.floor(seconds/60)+':'+String(seconds%60).padStart(2,'0');drain.style.width=(seconds/total*100)+'%'}function add30(){seconds+=30;total+=30;paint();if(navigator.vibrate)navigator.vibrate(35)}function finish(){seconds=0;paint();sheet.classList.add('done');document.getElementById('state').textContent='TIME. MOVE THE DAMN BAR.';run=false;if(navigator.vibrate)navigator.vibrate([180,80,180])}setInterval(()=>{if(run&&seconds>0){seconds--;paint();if(seconds===10&&navigator.vibrate)navigator.vibrate(80);if(seconds===0)finish()}},1000);paint()</script></body></html>
