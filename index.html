<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#E8E2D5">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Train">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Train</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* IRON & CHALK v3 — design language from the 7/29 Gemini pass, functionality intact. */
  :root{
    /* v6 palette (7/30, "push it harder") — FULL FLIP: bone-paper ground, black ink,
       oxblood stamps. Vintage gym bill. Var names keep their roles: --black = ground,
       --bone = ink/foreground, so every component inverts for free. */
    --black:#E8E2D5; --card:#F1ECE1; --bone:#191410; --dim:#5C5348;
    --ox:#8C1B14; --line:#BCAE97; --line2:#8E8069; --ctrl:#6E6250; --pine:#31543F;
    /* --line/--line2 = decorative rules only; --ctrl = interactive-control boundaries (>=3:1 on ground) */
    --fnum:'Anton',sans-serif; --fhead:'Oswald',sans-serif; --fbody:'Inter',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; background:var(--black); color:var(--bone);
    font:15px/1.5 var(--fbody);
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:520px; margin:0 auto; padding:20px 20px 110px}
  .num{font-family:var(--fnum); letter-spacing:.02em}
  .head{font-family:var(--fhead); text-transform:uppercase; letter-spacing:.03em}
  h1{font-family:var(--fhead); font-size:30px; text-transform:uppercase; letter-spacing:.02em; margin:4px 0 16px; line-height:1.1}
  .label{font-family:var(--fhead); font-size:13px; text-transform:uppercase; letter-spacing:.1em; color:var(--dim)}
  .label.lit{color:var(--bone)}
  .card{background:var(--card); border:2px solid var(--line); padding:18px; margin-bottom:16px}
  .rule{border:0; border-top:2px solid var(--line); margin:18px 0}
  .dotted{border:0; border-top:2px dotted var(--line); margin:18px 0}
  button{font:inherit; border:none; border-radius:0; cursor:pointer; color:var(--bone); background:none}
  .btn{display:flex; align-items:center; justify-content:center; width:100%; height:60px;
    border:2px solid var(--bone); font-family:var(--fhead); font-size:18px; text-transform:uppercase; letter-spacing:.06em}
  .btn:active{background:var(--bone); color:var(--black)}
  .btn.primary{background:var(--bone); color:var(--black)}
  .btn.primary:active{background:#3A322A}
  .btn.accent{background:var(--ox); border-color:var(--ox); color:#F1ECE1}
  .btn.accent:active{background:#5E0D0D; color:#F1ECE1}
  .btn.small{height:48px; font-size:15px; border:2px solid var(--ctrl); color:var(--dim)}
  input:focus-visible,textarea:focus-visible{border-bottom-color:var(--ox) !important}
  button:focus-visible,a:focus-visible{outline:2px solid var(--ox); outline-offset:2px}
  .btn+.btn{margin-top:12px}
  /* sealed ticket */
  .sealwrap{text-align:center; padding:12px 0}
  .seal{border:4px solid var(--line); padding:24px 18px; position:relative; margin:18px 0}
  .seal::before,.seal::after{content:''; position:absolute; width:18px; height:18px; background:var(--black);
    border:4px solid var(--line); border-radius:50%; top:50%; transform:translateY(-50%)}
  .seal::before{left:-13px} .seal::after{right:-13px}
  .seal .day{font-family:var(--fnum); font-size:96px; line-height:.95; margin:0; color:var(--ox)}
  .seal .mon{font-family:var(--fhead); font-size:26px; text-transform:uppercase; letter-spacing:.08em; margin:2px 0 0}
  /* coach banner */
  .coach{border-left:4px solid var(--ox); background:rgba(140,27,20,.07); padding:12px 16px; margin:0 0 20px}
  .coach .label{margin-bottom:4px}
  .coach p{margin:0; font-style:italic; color:var(--dim); font-size:14px}
  /* exercise blocks — workout mode: one dominant card, the rest collapse to receipt lines */
  .block .exname{font-family:var(--fhead); font-weight:700; font-size:21px; text-transform:uppercase; color:var(--bone); margin:0 0 4px}
  .block .rx{font:14px/1.45 var(--fbody); color:var(--dim); text-transform:none; letter-spacing:0; margin-bottom:14px}
  .whead{position:sticky; top:0; z-index:15; background:var(--black); border-bottom:2px solid var(--bone);
    display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:12px 0; margin:-20px 0 14px;
    font-family:var(--fhead); font-size:12px; letter-spacing:.08em; text-transform:uppercase}
  .whead .sync.ok{color:var(--pine)} .whead .sync.q{color:var(--ox)}
  .receipt{display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%; text-align:left;
    border:2px solid var(--line); padding:15px 16px; margin-bottom:8px;
    font-family:var(--fhead); font-size:14px; text-transform:uppercase; letter-spacing:.04em; color:var(--dim)}
  .receipt.done{background:var(--bone); border-color:var(--bone); color:var(--black)}
  .receipt.done .st{color:var(--pine)}
  .receipt .st{font-size:12px; white-space:nowrap}
  .logrow{display:flex; height:68px; border-bottom:2px solid var(--line); margin-bottom:8px; background:transparent}
  .logrow .sn{flex:0 0 40px; display:flex; align-items:center; font-family:var(--fhead); font-size:17px; color:var(--dim)}
  .logrow .grp{flex:1; display:flex; border-left:2px solid var(--line); border-right:2px solid var(--line)}
  .logrow .box{flex:1; position:relative; display:flex; flex-direction:column; justify-content:center}
  .logrow .box+.box{border-left:2px solid var(--line)}
  .logrow .box span{position:absolute; bottom:4px; left:0; width:100%; text-align:center;
    font-family:var(--fhead); font-size:11px; letter-spacing:.1em; color:var(--dim)}
  .logrow input{background:transparent; border:none; outline:none; color:var(--bone); width:100%;
    font-family:var(--fhead); font-size:26px; text-align:center; padding-bottom:10px}
  .logrow .go{flex:0 0 64px; font-family:var(--fhead); font-size:24px; border-left:2px solid var(--ox); color:var(--ox)}
  .logrow.done{background:var(--bone); height:44px}
  .logrow.done .sn,.logrow.done .box span{color:var(--black)}
  .logrow.done input{color:var(--black); font-size:18px; padding-bottom:10px}
  .logrow.done .go{color:#7FBF9A; font-weight:700; border-left:2px solid var(--black); font-size:18px}
  .filmbadge{display:inline-flex; align-items:center; gap:8px; font-family:var(--fhead); font-size:14px;
    text-transform:uppercase; letter-spacing:.06em; color:#F1ECE1; background:var(--ox); border:2px solid var(--ox); padding:13px 16px; margin-top:12px}
  .filmbadge .dot{width:10px; height:10px; background:#F1ECE1; border-radius:50%}
  .skip{color:var(--dim); font-size:13px; text-decoration:underline; padding:14px 0; display:inline-block}
  /* scales */
  .scales{display:flex; gap:8px; overflow-x:auto; padding:8px 0 10px; scrollbar-width:none}
  .scales::-webkit-scrollbar{display:none}
  .scales button{flex:0 0 56px; height:56px; border:2px solid var(--ctrl); font-family:var(--fnum); font-size:22px}
  .scales button.sel{background:var(--ox); color:#F1ECE1; border-color:var(--ox)}
  textarea{width:100%; background:transparent; border:none; border-bottom:2px solid var(--ctrl);
    color:var(--bone); font:16px var(--fbody); padding:8px 0; min-height:56px; resize:none; outline:none}
  /* rest timer — a deliberate bottom sheet, not a sliver */
  .timer{position:fixed; left:0; right:0; bottom:calc(72px + env(safe-area-inset-bottom)); background:var(--black);
    border-top:2px solid var(--ox); padding:16px 20px 18px; display:none; align-items:center; justify-content:space-between; gap:12px; z-index:10; overflow:hidden}
  .timer.on{display:flex}
  .timer.fin{background:var(--pine); border-top-color:var(--pine)}
  .timer.fin .t,.timer.fin .label{color:#F1ECE1}
  .timer.fin .drain{display:none}
  .timer .drain{position:absolute; left:0; top:0; bottom:0; background:rgba(140,27,20,.18); transition:width 1s linear; pointer-events:none}
  .timer .t{font-family:var(--fnum); font-size:64px; line-height:1}
  .timer .tbtn{border:2px solid var(--ctrl); color:var(--dim); padding:14px 16px; font-family:var(--fhead); font-size:14px; text-transform:uppercase; letter-spacing:.08em; position:relative; z-index:1}
  /* review */
  .fb{border-left:2px solid var(--dim); padding-left:14px; margin-top:12px; font-size:14px; color:var(--dim); white-space:pre-wrap}
  .fbsec{margin-top:12px; border-left:3px solid var(--ox); padding-left:12px}
  .fbsec.keep{border-left-color:var(--pine)}
  .fbsec b{display:block; font-family:var(--fhead); font-size:12px; letter-spacing:.12em; color:var(--ox); margin-bottom:4px}
  .fbsec.keep b{color:var(--pine)}
  .fbsec p{margin:0; font-size:14px; color:var(--bone); white-space:pre-wrap}
  .zoo{display:flex; flex-wrap:wrap; gap:4px; justify-content:center; margin:14px 0 4px}
  .zoo svg{width:42px; height:42px}
  .pending{font-family:var(--fhead); font-size:15px; text-transform:uppercase; letter-spacing:.08em; color:var(--ox); margin-top:12px}
  video{width:100%; margin-top:10px; background:#000; border:2px solid var(--line)}
  /* progress */
  .poster{font-family:var(--fnum); font-size:92px; line-height:.95; margin:0}
  .poster small{font-family:var(--fhead); font-size:22px; color:var(--dim); letter-spacing:.04em}
  .spark{width:100%; height:56px; border-bottom:2px solid var(--line); margin:18px 0}
  .lb-row{display:flex; align-items:baseline; margin-bottom:12px; font-family:var(--fhead); font-size:17px; text-transform:uppercase}
  .lb-dots{flex:1; border-bottom:2px dotted var(--line); margin:0 8px; position:relative; top:-4px}
  .lb-val{font-family:var(--fnum); font-size:22px; color:var(--ox)}
  .statrow{display:flex; justify-content:space-between; align-items:baseline; padding:10px 0; border-bottom:1px dotted var(--line2); font-size:14px}
  /* fuel */
  .track{width:100%; height:14px; background:var(--line); margin:14px 0 8px}
  .track i{display:block; height:100%; background:var(--ox); transition:width .3s}
  .track.hit i{background:var(--pine)}
  .chips{display:flex; gap:10px; overflow-x:auto; padding:6px 0 12px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:0 0 auto; border:2px solid var(--ctrl); padding:12px 18px;
    font-family:var(--fhead); font-size:14px; text-transform:uppercase; letter-spacing:.04em}
  .chips button:active{background:var(--bone); color:var(--black)}
  .mealrow{display:flex; justify-content:space-between; gap:8px; border-bottom:1px dotted var(--line2); padding:12px 0;
    font-family:var(--fhead); font-size:14px; text-transform:uppercase; color:var(--dim)}
  .mealrow .g{color:var(--bone); font-family:var(--fnum); font-size:16px; white-space:nowrap}
  /* tab bar */
  .tabbar{position:fixed; left:0; right:0; bottom:0; height:calc(72px + env(safe-area-inset-bottom)); display:flex;
    background:var(--black); border-top:2px solid var(--line); padding-bottom:env(safe-area-inset-bottom); z-index:20}
  .tabbar button{flex:1; font-family:var(--fhead); font-size:13px; text-transform:uppercase; letter-spacing:.1em; color:var(--dim); position:relative}
  .tabbar button.main{flex:1.4; font-size:16px; font-weight:700; color:var(--bone)}
  .tabbar button.sel{color:var(--ox)}
  .tabbar button.sel::after{content:''; position:absolute; bottom:12px; left:50%; transform:translateX(-50%); width:24px; height:2px; background:var(--ox)}
  .warn{color:var(--ox); font-size:13px; margin-top:8px}
  .good{color:var(--pine); font-size:13px; margin-top:8px}
  .cuebox{border-left:3px solid var(--ox); background:var(--card); padding:12px 14px; margin-top:12px; font-size:14px}
  .cuebox b{display:block; font-family:var(--fhead); font-size:11px; letter-spacing:.12em; color:var(--ox); margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="timer" id="timer">
  <div class="drain" id="tdrain"></div>
  <div style="position:relative;z-index:1"><div class="label lit">Rest</div><div class="t" id="tval">0:00</div></div>
  <div style="display:flex;gap:10px;position:relative;z-index:1">
    <button class="tbtn" onclick="bump30()">+30</button>
    <button class="tbtn" onclick="stopTimer()">Skip</button>
  </div>
</div>
<div class="tabbar" id="tabbar"></div>
<script>
const $=id=>document.getElementById(id);
// escape anything dynamic that rides innerHTML — server/model/user strings are data, not markup
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>{try{const x=new URL(u);return x.protocol==='https:'?x.href:null}catch(e){return null}};
const MONTHS=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const store={
  get k(){return 'wlog'},
  load(){try{return JSON.parse(localStorage.getItem(this.k))||{}}catch(e){return{}}},
  save(d){localStorage.setItem(this.k,JSON.stringify(d))}
};
let S=null, ALLSESS=[], log=store.load(), sec=0, tint=null, tTotal=90, view='today';
const DEFAULT_ENDPOINT='https://train-sync.byler-train.workers.dev';

if(location.hash.startsWith('#cfg=')){
  localStorage.setItem('synccfg', location.hash.slice(5));
  history.replaceState(null,'',location.pathname);
}
function cfg(){const c=localStorage.getItem('synccfg');return c?c.split('|'):null}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function j(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}}
function sv(k,v){localStorage.setItem(k,JSON.stringify(v))}

let loadFailed=false;
async function init(){
  try{
    const r=await fetch('data/sessions.json?_='+Date.now());
    if(!r.ok)throw new Error(r.status);
    ALLSESS=(await r.json()).sessions;
  }catch(e){ALLSESS=[];loadFailed=true}
  S=ALLSESS.find(s=>!(log[s.id]&&log[s.id].completed))||null;
  flushOutbox();
  route();
}
function tabbar(){
  const t=[['review','Review'],['progress','Progress'],['today','Train'],['fuel','Fuel'],['gear','Gear']];
  $('tabbar').innerHTML=t.map(([v,l])=>`<button class="${v==='today'?'main ':''}${view===v?'sel':''}" onclick="view='${v}';route()">${l}</button>`).join('');
}
function route(){tabbar();({today:render,review:renderReview,progress:renderProgress,fuel:renderFuel,gear:renderGear})[view]()}

/* ---------- UNITS ---------- */
const KG2LB=2.20462;
function unit(){return localStorage.getItem('unit')||'lb'}
function toggleUnit(){localStorage.setItem('unit',unit()==='lb'?'kg':'lb');route()}
function unitBtn(){return `<button class="skip" style="text-decoration:none;border:2px solid var(--ctrl);padding:12px 14px;font-family:var(--fhead);letter-spacing:.08em" onclick="toggleUnit()">UNITS: ${unit().toUpperCase()}</button>`}
function setLbs(st){const w=parseFloat(st&&st.w);if(!w)return 0;return (st.u==='kg')?w*KG2LB:w}
function both(lbs){if(!lbs)return '—';const kg=lbs/KG2LB;
  return unit()==='kg'?`${Math.round(kg*10)/10} KG · ${Math.round(lbs)} LB`:`${Math.round(lbs)} LB · ${Math.round(kg*10)/10} KG`}
function targetIn(lbs){if(lbs==null)return '';return unit()==='kg'?String(Math.round(lbs/KG2LB*2)/2):String(lbs)}

/* ---------- FUEL STRIP (home) ---------- */
function fuelStrip(){
  const f=j('fuel:'+today(),{g:0,items:[]});
  const pct=Math.min(100,Math.round(f.g/140*100));
  return `<div class="card" style="padding:12px 16px;cursor:pointer" onclick="view='fuel';route()">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span class="label lit">FUEL</span>
      <span><span class="num" style="font-size:24px">${f.g}</span><span class="label">/140G</span></span></div>
    <div class="track ${f.g>=140?'hit':''}" style="margin:8px 0 2px;height:8px"><i style="width:${pct}%"></i></div></div>`;
}
function howto(b){
  const q=b.howto||('how to '+b.name.replace(/\(.*?\)/g,'').replace(/[—-].*$/,'').trim()+' exercise proper form');
  const url=(b.howto&&safeUrl(b.howto))||'https://www.youtube.com/results?search_query='+encodeURIComponent(q);
  return `<a href="${esc(url)}" target="_blank" rel="noopener" class="label" style="text-decoration:none;border:2px solid var(--ctrl);padding:12px 14px;font-size:11px;float:right">HOW ▸</a>`;
}

function connectBanner(){
  if(cfg())return '';
  return `<div class="card" style="border-color:var(--ox)">
    <div class="warn" style="margin:0 0 10px">NOT CONNECTED — logs stay on this phone; uploads won't work.</div>
    <button class="btn small" onclick="connect()">Connect (paste setup key)</button></div>`;
}
function connect(){
  let v=prompt('Paste your setup key (or the full link) from Claude');
  if(!v)return;
  v=v.replace(/["'\s]/g,'');
  if(v.includes('#cfg='))v=v.split('#cfg=')[1];
  let c;
  if(v.includes('|'))c=v;
  else{
    const tok=(v.match(/[a-f0-9]{32,}/i)||[])[0];
    if(!tok){alert('No key found in that paste — paste the long code Claude sent.');return}
    c=DEFAULT_ENDPOINT+'|'+tok;
  }
  const [ep,tok]=c.split('|');
  fetch(ep+'/pull',{headers:{'Authorization':'Bearer '+tok}}).then(r=>{
    if(r.ok){localStorage.setItem('synccfg',c);alert('Connected ✓');route()}
    else alert('That key was rejected by the server — it may be incomplete. Re-copy the whole code and try again.');
  }).catch(()=>alert('Could not reach the sync server — check your connection and try again.'));
}

/* ---------- TODAY ---------- */
function sealCard(kicker,btn){
  const d=new Date(S.date+'T12:00');
  return `<div class="sealwrap">
    <div class="label">${kicker}</div>
    <div class="seal">
      <div class="day num">${d.getDate()}</div>
      <div class="mon">${MONTHS[d.getMonth()]}</div>
      <hr class="dotted">
      <div class="label lit">${S.place.toUpperCase()}</div>
      <div class="label" style="margin-top:8px">${S.time.toUpperCase()}</div>
    </div>${btn}</div>`;
}
function render(){
  const app=$('app');
  if(!S){app.innerHTML=connectBanner()+fuelStrip()+(loadFailed
    ?`<div class="sealwrap"><div class="seal"><div class="mon">Can't load sessions</div><hr class="dotted"><div class="label">Offline and nothing cached — reopen with signal.</div></div><button class="btn small" onclick="init()">Retry</button></div>`
    :`<div class="sealwrap"><div class="seal"><div class="mon">No session queued</div><hr class="dotted"><div class="label">Claude programs the next one tonight.</div></div></div>`);return}
  const L=log[S.id]||(log[S.id]={revealed:false,blocks:{},completed:false});
  if(L.completed)return renderDone();
  const idx=ALLSESS.indexOf(S);
  const prev=idx>0?log[ALLSESS[idx-1].id]:null;
  if(prev&&prev.completedAt&&prev.completedAt.slice(0,10)===today()){
    app.innerHTML=connectBanner()+fuelStrip()+`<div class="sealwrap">
      <div class="poster num">DONE</div>
      <hr class="rule">
      <div class="head" style="color:var(--ox);font-size:20px">Recovery required</div>
      <p style="color:var(--dim)">Next session unlocks tomorrow. Protein and sleep are the workout now.</p></div>`+requestsCard();
    return;
  }
  if(!L.revealed && today()<S.date){
    app.innerHTML=connectBanner()+fuelStrip()+sealCard('Sealed','');
    return;
  }
  if(!L.revealed){
    app.innerHTML=connectBanner()+fuelStrip()+sealCard('Today',`<button class="btn accent" onclick="reveal()">Break seal</button>`);
    return;
  }
  const snum=String(idx+1).padStart(3,'0');
  // ---- workout mode: one dominant exercise, everything else collapses to receipt lines ----
  const btotal=b=>(b.type==='timed'||b.type==='measure')?1:b.sets;
  const bdone=(b,bl)=>(b.type==='timed'||b.type==='measure')?((bl.sets[0]&&bl.sets[0].done)?1:0):bl.sets.filter(s=>s&&s.done).length;
  const bfin=(b,bl)=>bl.skipped||bdone(b,bl)>=btotal(b);
  for(const b of S.blocks)L.blocks[b.id]||(L.blocks[b.id]={sets:[],skipped:false});
  const firstOpen=S.blocks.find(b=>!bfin(b,L.blocks[b.id]));
  const activeId=(EXP&&S.blocks.some(b=>b.id===EXP))?EXP:(firstOpen&&firstOpen.id);
  const exN=S.blocks.length, exI=Math.max(1,S.blocks.findIndex(b=>b.id===activeId)+1);
  const setsLeft=S.blocks.reduce((n,b)=>n+(L.blocks[b.id].skipped?0:btotal(b)-bdone(b,L.blocks[b.id])),0);
  const obq=outbox().length;
  let h=connectBanner()+`<div class="whead">
    <span>SESSION ${snum} · EX ${exI}/${exN} · ${setsLeft} SET${setsLeft===1?'':'S'} LEFT</span>
    <span><span id="whElapsed">${elapsedMin(L)}</span> · <span class="sync ${obq?'q':'ok'}">${obq?'QUEUED':'SYNCED'}</span></span></div>`;
  h+=`<div style="display:flex;justify-content:space-between;align-items:center"><h1 style="margin:0">${esc(S.phase.replace(/^Phase \d+ · /,''))}</h1>${unitBtn()}</div>`;
  if(S.formCue)h+=`<div class="coach" style="margin-top:12px"><div class="label" style="color:var(--ox)">Form focus</div><p>"${esc(S.formCue)}"</p></div>`;
  for(const b of S.blocks){
    const bl=L.blocks[b.id];
    const fin=bfin(b,bl), active=b.id===activeId;
    if(!active){ // collapsed receipt line — tap to expand

function zooStamp(vol,seed){

  if(!cands.length)cands=[vol<ZOO[0][1]*2?ZOO[0]:ZOO[ZOO.length-1]];
  const [name,w]=cands[h%cands.length];
  const count=Math.max(1,Math.round(vol/w));
  const shown=Math.min(count,36);
  return `<hr class="dotted" style="margin:14px 0 10px">
    <div class="label">TOTAL IRON MOVED</div>
    <div style="display:flex;align-items:baseline;justify-content:center;gap:8px"><span class="num" style="font-size:44px;color:var(--ox)">${count}</span><span class="head" style="font-size:16px">${esc(name.toUpperCase())}</span></div>
    <div class="zoo">${animalSVG(name).repeat(shown)}</div>
    ${count>shown?`<div class="label" style="font-size:12px">+ ${count-shown} more ${esc(name)}</div>`:''}
    <div class="label" style="font-size:12px;margin-top:2px">${both(vol)} — that's ~${count} ${esc(name)}</div>`;
}

// coach notes render as stamped sections when the review uses the KEEP/FIX/WATCH/NEXT headings
function fbHtml(notes){
  const heads={'KEEP':'keep','FIX NEXT SET':'','FIX':'','WATCH':'','NEXT SESSION':'','NEXT':''};
  const re=/^(KEEP|FIX NEXT SET|FIX|WATCH|NEXT SESSION|NEXT)\s*[:—-]\s*/i;
  const lines=String(notes||'').split(/\n/);
  const secs=[];let cur=null;
  for(const ln of lines){
    const m=ln.match(re);
    if(m){cur={h:m[1].toUpperCase(),body:[ln.replace(re,'')]};secs.push(cur)}
    else if(cur)cur.body.push(ln);
  }
  if(secs.length<2)return `<div class="fb">${esc(notes)}</div>`;
  return secs.map(s=>`<div class="fbsec ${s.h==='KEEP'?'keep':''}"><b>${esc(s.h)}</b><p>${esc(s.body.join('\n').trim())}</p></div>`).join('');
}
async function playClip(key,btn){
  btn.textContent='Loading…';
  const [endpoint,token]=cfg();
  try{
    const r=await fetch(endpoint+'/media/'+encodeURIComponent(key),{headers:{'Authorization':'Bearer '+token}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const blob=await r.blob();
    const v=document.createElement('video');
    v.src=URL.createObjectURL(blob);v.controls=true;v.playsInline=true;
    btn.after(v);btn.remove();v.play();
  }catch(e){btn.textContent='▶ Watch (failed — retry)'}
}

function weekCount(){
  const now=new Date(); const day=(now.getDay()+6)%7;
  const mon=new Date(now); mon.setDate(now.getDate()-day); mon.setHours(0,0,0,0);
  let n=0;
  for(const s of ALLSESS){const L=log[s.id];if(L&&L.completed&&L.completedAt&&new Date(L.completedAt)>=mon)n++}
  return n;
}
function sparkline(vals){
  if(vals.length<2)return '<div class="spark"></div>';
  const w=280,h=50,min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-4-((v-min)/rng)*(h-8)).toFixed(1)}`).join(' ');
  return `<div class="spark"><svg width="100%" height="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="overflow:visible">
    <polyline points="${pts}" fill="none" stroke="#8C1B14" stroke-width="4" opacity=".4" transform="translate(0,2)"/>
    <polyline points="${pts}" fill="none" stroke="#8C1B14" stroke-width="2"/></svg></div>`;
}

    const q=j('mealq',[]);q.push({key:firstKey,date:today()});sv('mealq',q);
    renderFuel();pollMeals();
  }catch(e){alert('Upload failed — try again.')}
}
let mealTimer=null;
function pollMeals(){
  clearInterval(mealTimer);
  mealTimer=setInterval(async()=>{
    if(!j('mealq',[]).length){clearInterval(mealTimer);return}
    if(await checkMealQueue()&&view==='fuel')renderFuel();
  },20000);
}
async function nearMe(){
  const send=async txt=>{
    const c=cfg();if(!c){alert('Connect first (Today tab).');return}
    const [endpoint,token]=c;
    const key=`suggest/${today()}-${Date.now()}.txt`;
    const res=await fetch(endpoint+'/upload?key='+encodeURIComponent(key),{method:'POST',
      headers:{'Authorization':'Bearer '+token,'Content-Type':'text/plain'},body:txt});
    const rj=res.ok?await res.json():null;
    if(rj&&rj.size>0){const q=j('suggestq',[]);q.push({key,date:today()});sv('suggestq',q);renderFuel();pollSuggest()}
    else alert('Request failed — try again.');
  };
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      p=>send(p.coords.latitude.toFixed(5)+','+p.coords.longitude.toFixed(5)),
      ()=>{const t=prompt('Location unavailable — where are you? (e.g. "Town Center VB")');if(t)send(t)},
      {timeout:8000});
  }else{const t=prompt('Where are you?');if(t)send(t)}
}
let sugTimer=null;
function pollSuggest(){
  clearInterval(sugTimer);
  sugTimer=setInterval(async()=>{
    const q=j('suggestq',[]);
    if(!q.length){clearInterval(sugTimer);return}
    const c=cfg();if(!c)return;
    const [endpoint,token]=c;
    try{
      const fb=await fetch(endpoint+'/feedback',{headers:{'Authorization':'Bearer '+token}}).then(r=>r.json());
      const remain=[];
      for(const it of q){
        const f=fb[it.key];
        if(!f){remain.push(it);continue}
        try{
          const m=JSON.parse(f.notes.match(/\{.*\}/s)[0]);
          sv('suggest',{...m,date:it.date});
        }catch(e){}
      }
      sv('suggestq',remain);
      if(view==='fuel')renderFuel();
    }catch(e){}
  },20000);
}
function addFuel(n,g){
  const key='fuel:'+today();const f=j(key,{g:0,items:[]});
  f.items.push({n,g});f.g+=g;sv(key,f);
  postLog({type:'nutrition',date:today(),protein_g:f.g,items:f.items});
  renderFuel();
}
function addCustom(){
  const g=parseInt(prompt('Protein grams?'));if(!g)return;
  const n=prompt('What was it?')||'Custom';
  addFuel(n,g);
}
function rmFuel(i){
  const key='fuel:'+today();const f=j(key,{g:0,items:[]});
  f.g-=f.items[i].g;f.items.splice(i,1);sv(key,f);
  postLog({type:'nutrition',date:today(),protein_g:f.g,items:f.items});
  renderFuel();
}

init();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
