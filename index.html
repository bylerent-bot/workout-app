<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>Train</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Oswald:wght@400;500;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  /* IRON & CHALK v3 — design language from the 7/29 Gemini pass, functionality intact. */
  :root{
    /* v6 palette (7/30, "push it harder") — FULL FLIP: bone-paper ground, black ink,
       oxblood stamps. Vintage gym bill. Var names keep their roles: --black = ground,
       --bone = ink/foreground, so every component inverts for free. */
    --black:#E8E2D5; --card:#F1ECE1; --bone:#191410; --dim:#6E6458;
    --ox:#8C1B14; --oxbright:#A64B3F; --line:#C9BFAE; --line2:#A69B88;
    --fnum:'Anton',sans-serif; --fhead:'Oswald',sans-serif; --fbody:'Inter',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; background:var(--black); color:var(--bone);
    font:15px/1.5 var(--fbody);
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:520px; margin:0 auto; padding:20px 20px 110px}
  .num{font-family:var(--fnum); letter-spacing:.02em}
  .head{font-family:var(--fhead); text-transform:uppercase; letter-spacing:.03em}
  h1{font-family:var(--fhead); font-size:30px; text-transform:uppercase; letter-spacing:.02em; margin:4px 0 16px; line-height:1.1}
  .label{font-family:var(--fhead); font-size:13px; text-transform:uppercase; letter-spacing:.1em; color:var(--dim)}
  .label.lit{color:var(--bone)}
  .card{background:var(--card); border:2px solid var(--line); padding:18px; margin-bottom:16px}
  .rule{border:0; border-top:2px solid var(--line); margin:18px 0}
  .dotted{border:0; border-top:2px dotted var(--line); margin:18px 0}
  button{font:inherit; border:none; border-radius:0; cursor:pointer; color:var(--bone); background:none}
  .btn{display:flex; align-items:center; justify-content:center; width:100%; height:60px;
    border:2px solid var(--bone); font-family:var(--fhead); font-size:18px; text-transform:uppercase; letter-spacing:.06em}
  .btn:active{background:var(--bone); color:var(--black)}
  .btn.primary{background:var(--bone); color:var(--black)}
  .btn.primary:active{background:#3A322A}
  .btn.accent{background:var(--ox); border-color:var(--ox)}
  .btn.accent:active{background:#5E0D0D}
  .btn.small{height:48px; font-size:15px; border:1px solid var(--line2); color:var(--dim)}
  .btn+.btn{margin-top:12px}
  /* sealed ticket */
  .sealwrap{text-align:center; padding:26px 0}
  .seal{border:4px solid var(--line); padding:36px 18px; position:relative; margin:18px 0}
  .seal::before,.seal::after{content:''; position:absolute; width:18px; height:18px; background:var(--black);
    border:4px solid var(--line); border-radius:50%; top:50%; transform:translateY(-50%)}
  .seal::before{left:-13px} .seal::after{right:-13px}
  .seal .day{font-family:var(--fnum); font-size:96px; line-height:.95; margin:0}
  .seal .mon{font-family:var(--fhead); font-size:26px; text-transform:uppercase; letter-spacing:.08em; margin:2px 0 0}
  /* coach banner */
  .coach{border-left:4px solid var(--ox); background:var(--card); padding:12px 16px; margin:0 0 20px}
  .coach .label{margin-bottom:4px}
  .coach p{margin:0; font-style:italic; color:var(--dim); font-size:14px}
  /* exercise blocks */
  .block .exname{font-family:var(--fhead); font-size:19px; text-transform:uppercase; color:var(--bone); margin:0 0 4px}
  .block .rx{margin-bottom:14px}
  .logrow{display:flex; height:60px; border-bottom:2px solid var(--line); margin-bottom:8px; background:transparent}
  .logrow .sn{flex:0 0 44px; display:flex; align-items:center; font-family:var(--fhead); font-size:17px; color:var(--dim)}
  .logrow .grp{flex:1; display:flex; border-left:2px solid var(--line); border-right:2px solid var(--line)}
  .logrow .box{flex:1; position:relative; display:flex; flex-direction:column; justify-content:center}
  .logrow .box+.box{border-left:2px solid var(--line)}
  .logrow .box span{position:absolute; bottom:3px; left:0; width:100%; text-align:center;
    font-family:var(--fhead); font-size:9px; letter-spacing:.1em; color:var(--dim)}
  .logrow input{background:transparent; border:none; outline:none; color:var(--bone); width:100%;
    font-family:var(--fhead); font-size:22px; text-align:center; padding-bottom:8px}
  .logrow .go{flex:0 0 76px; font-family:var(--fhead); font-size:16px; letter-spacing:.06em; text-transform:uppercase}
  .logrow.done{background:var(--bone)}
  .logrow.done .sn,.logrow.done .box span{color:var(--black)}
  .logrow.done input{color:var(--black)}
  .logrow.done .go{color:var(--black); font-weight:700; border-left:2px solid var(--black)}
  .filmbadge{display:inline-flex; align-items:center; gap:8px; font-family:var(--fhead); font-size:14px;
    text-transform:uppercase; letter-spacing:.06em; color:#9A2A20; border:1px solid var(--ox); padding:10px 16px; margin-top:12px}
  .filmbadge .dot{width:10px; height:10px; background:var(--ox); border-radius:50%}
  .skip{color:var(--dim); font-size:13px; text-decoration:underline; padding:10px 0; display:inline-block}
  /* scales */
  .scales{display:flex; gap:8px; overflow-x:auto; padding:8px 0 10px; scrollbar-width:none}
  .scales::-webkit-scrollbar{display:none}
  .scales button{flex:0 0 56px; height:56px; border:2px solid var(--line); font-family:var(--fnum); font-size:22px}
  .scales button.sel{background:var(--bone); color:var(--black); border-color:var(--bone)}
  textarea{width:100%; background:transparent; border:none; border-bottom:2px solid var(--line);
    color:var(--bone); font:14px var(--fbody); padding:8px 0; min-height:56px; resize:none; outline:none}
  /* rest timer */
  .timer{position:fixed; left:0; right:0; bottom:calc(72px + env(safe-area-inset-bottom)); background:var(--black);
    border-top:2px solid var(--ox); padding:10px 20px; display:none; align-items:center; justify-content:space-between; z-index:10; overflow:hidden}
  .timer.on{display:flex}
  .timer .drain{position:absolute; left:0; top:0; bottom:0; background:rgba(125,17,17,.22); transition:width 1s linear; pointer-events:none}
  .timer .t{font-family:var(--fnum); font-size:40px}
  .timer .stop{border:1px solid var(--line2); color:var(--dim); padding:12px 16px; font-family:var(--fhead); font-size:13px; text-transform:uppercase; letter-spacing:.08em}
  /* review */
  .fb{border-left:2px solid var(--dim); padding-left:14px; margin-top:12px; font-size:14px; color:var(--dim); white-space:pre-wrap}
  .pending{font-family:var(--fhead); font-size:15px; text-transform:uppercase; letter-spacing:.08em; color:#9A2A20; margin-top:12px}
  video{width:100%; margin-top:10px; background:#000; border:2px solid var(--line)}
  /* progress */
  .poster{font-family:var(--fnum); font-size:92px; line-height:.95; margin:0}
  .poster small{font-family:var(--fhead); font-size:22px; color:var(--dim); letter-spacing:.04em}
  .spark{width:100%; height:56px; border-bottom:2px solid var(--line); margin:18px 0}
  .lb-row{display:flex; align-items:baseline; margin-bottom:12px; font-family:var(--fhead); font-size:17px; text-transform:uppercase}
  .lb-dots{flex:1; border-bottom:2px dotted var(--line); margin:0 8px; position:relative; top:-4px}
  .lb-val{font-family:var(--fnum); font-size:22px}
  .statrow{display:flex; justify-content:space-between; align-items:baseline; padding:10px 0; border-bottom:1px solid var(--line); font-size:14px}
  /* fuel */
  .track{width:100%; height:14px; background:var(--line); margin:14px 0 8px}
  .track i{display:block; height:100%; background:var(--ox); transition:width .3s}
  .track.hit i{background:var(--bone)}
  .chips{display:flex; gap:10px; overflow-x:auto; padding:6px 0 12px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:0 0 auto; border:2px solid var(--line); padding:12px 18px;
    font-family:var(--fhead); font-size:14px; text-transform:uppercase; letter-spacing:.04em}
  .chips button:active{background:var(--bone); color:var(--black)}
  .mealrow{display:flex; justify-content:space-between; gap:8px; border-bottom:1px solid var(--line); padding:12px 0;
    font-family:var(--fhead); font-size:14px; text-transform:uppercase; color:var(--dim)}
  .mealrow .g{color:var(--bone); font-family:var(--fnum); font-size:16px; white-space:nowrap}
  /* tab bar */
  .tabbar{position:fixed; left:0; right:0; bottom:0; height:calc(72px + env(safe-area-inset-bottom)); display:flex;
    background:var(--black); border-top:2px solid var(--line); padding-bottom:env(safe-area-inset-bottom); z-index:20}
  .tabbar button{flex:1; font-family:var(--fhead); font-size:13px; text-transform:uppercase; letter-spacing:.1em; color:var(--dim); position:relative}
  .tabbar button.sel{color:var(--bone)}
  .tabbar button.sel::after{content:''; position:absolute; bottom:12px; left:50%; transform:translateX(-50%); width:24px; height:2px; background:var(--ox)}
  .warn{color:#9A2A20; font-size:13px; margin-top:8px}
  .good{color:var(--bone); font-size:13px; margin-top:8px}
  .cuebox{border-left:3px solid var(--ox); background:var(--card); padding:12px 14px; margin-top:12px; font-size:14px}
  .cuebox b{display:block; font-family:var(--fhead); font-size:11px; letter-spacing:.12em; color:#9A2A20; margin-bottom:6px}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="timer" id="timer">
  <div class="drain" id="tdrain"></div>
  <div class="label lit">Rest</div>
  <div class="t" id="tval">0:00</div>
  <button class="stop" onclick="stopTimer()">Done</button>
</div>
<div class="tabbar" id="tabbar"></div>
<script>
const $=id=>document.getElementById(id);
const MONTHS=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const store={
  get k(){return 'wlog'},
  load(){try{return JSON.parse(localStorage.getItem(this.k))||{}}catch(e){return{}}},
  save(d){localStorage.setItem(this.k,JSON.stringify(d))}
};
let S=null, ALLSESS=[], log=store.load(), sec=0, tint=null, tTotal=90, view='today';
const DEFAULT_ENDPOINT='https://train-sync.byler-train.workers.dev';

if(location.hash.startsWith('#cfg=')){
  localStorage.setItem('synccfg', location.hash.slice(5));
  history.replaceState(null,'',location.pathname);
}
function cfg(){const c=localStorage.getItem('synccfg');return c?c.split('|'):null}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function j(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}}
function sv(k,v){localStorage.setItem(k,JSON.stringify(v))}

async function init(){
  try{
    const r=await fetch('data/sessions.json?_='+Date.now());
    ALLSESS=(await r.json()).sessions;
  }catch(e){ALLSESS=[]}
  S=ALLSESS.find(s=>!(log[s.id]&&log[s.id].completed))||null;
  route();
}
function tabbar(){
  const t=[['today','Today'],['review','Review'],['progress','Progress'],['fuel','Fuel'],['gear','Gear']];
  $('tabbar').innerHTML=t.map(([v,l])=>`<button class="${view===v?'sel':''}" onclick="view='${v}';route()">${l}</button>`).join('');
}
function route(){tabbar();({today:render,review:renderReview,progress:renderProgress,fuel:renderFuel,gear:renderGear})[view]()}

/* ---------- UNITS ---------- */
const KG2LB=2.20462;
function unit(){return localStorage.getItem('unit')||'lb'}
function toggleUnit(){localStorage.setItem('unit',unit()==='lb'?'kg':'lb');route()}
function unitBtn(){return `<button class="skip" style="text-decoration:none;border:1px solid var(--line2);padding:6px 12px;font-family:var(--fhead);letter-spacing:.08em" onclick="toggleUnit()">UNITS: ${unit().toUpperCase()} ⇄</button>`}
function setLbs(st){const w=parseFloat(st&&st.w);if(!w)return 0;return (st.u==='kg')?w*KG2LB:w}
function both(lbs){if(!lbs)return '—';const kg=lbs/KG2LB;
  return unit()==='kg'?`${Math.round(kg*10)/10} KG · ${Math.round(lbs)} LB`:`${Math.round(lbs)} LB · ${Math.round(kg*10)/10} KG`}
function targetIn(lbs){if(lbs==null)return '';return unit()==='kg'?String(Math.round(lbs/KG2LB*2)/2):String(lbs)}

/* ---------- FUEL STRIP (home) ---------- */
function fuelStrip(){
  const f=j('fuel:'+today(),{g:0,items:[]});
  const pct=Math.min(100,Math.round(f.g/140*100));
  return `<div class="card" style="padding:12px 16px;cursor:pointer" onclick="view='fuel';route()">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span class="label lit">FUEL</span>
      <span><span class="num" style="font-size:24px">${f.g}</span><span class="label">/140G</span></span></div>
    <div class="track ${f.g>=140?'hit':''}" style="margin:8px 0 2px;height:8px"><i style="width:${pct}%"></i></div></div>`;
}
function howto(b){
  const q=b.howto||('how to '+b.name.replace(/\(.*?\)/g,'').replace(/[—-].*$/,'').trim()+' exercise proper form');
  const url=b.howto&&b.howto.startsWith('http')?b.howto:'https://www.youtube.com/results?search_query='+encodeURIComponent(q);
  return `<a href="${url}" target="_blank" rel="noopener" class="label" style="text-decoration:none;border:1px solid var(--line2);padding:4px 10px;font-size:11px;float:right">HOW ▸</a>`;
}

function connectBanner(){
  if(cfg())return '';
  return `<div class="card" style="border-color:var(--ox)">
    <div class="warn" style="margin:0 0 10px">NOT CONNECTED — logs stay on this phone; uploads won't work.</div>
    <button class="btn small" onclick="connect()">Connect (paste setup key)</button></div>`;
}
function connect(){
  let v=prompt('Paste your setup key (or the full link) from Claude');
  if(!v)return;
  v=v.replace(/["'\s]/g,'');
  if(v.includes('#cfg='))v=v.split('#cfg=')[1];
  let c;
  if(v.includes('|'))c=v;
  else{
    const tok=(v.match(/[a-f0-9]{32,}/i)||[])[0];
    if(!tok){alert('No key found in that paste — paste the long code Claude sent.');return}
    c=DEFAULT_ENDPOINT+'|'+tok;
  }
  const [ep,tok]=c.split('|');
  fetch(ep+'/pull',{headers:{'Authorization':'Bearer '+tok}}).then(r=>{
    if(r.ok){localStorage.setItem('synccfg',c);alert('Connected ✓');route()}
    else alert('That key was rejected by the server — it may be incomplete. Re-copy the whole code and try again.');
  }).catch(()=>alert('Could not reach the sync server — check your connection and try again.'));
}

/* ---------- TODAY ---------- */
function sealCard(kicker,btn){
  const d=new Date(S.date+'T12:00');
  return `<div class="sealwrap">
    <div class="label">${kicker}</div>
    <div class="seal">
      <div class="day num">${d.getDate()}</div>
      <div class="mon">${MONTHS[d.getMonth()]}</div>
      <hr class="dotted">
      <div class="label lit">${S.place.toUpperCase()}</div>
      <div class="label" style="margin-top:8px">${S.time.toUpperCase()}</div>
    </div>${btn}</div>`;
}
function render(){
  const app=$('app');
  if(!S){app.innerHTML=connectBanner()+fuelStrip()+`<div class="sealwrap"><div class="seal"><div class="mon">No session queued</div><hr class="dotted"><div class="label">Claude programs the next one tonight.</div></div></div>`;return}
  const L=log[S.id]||(log[S.id]={revealed:false,blocks:{},completed:false});
  if(L.completed)return renderDone();
  const idx=ALLSESS.indexOf(S);
  const prev=idx>0?log[ALLSESS[idx-1].id]:null;
  if(prev&&prev.completedAt&&prev.completedAt.slice(0,10)===today()){
    app.innerHTML=connectBanner()+fuelStrip()+`<div class="sealwrap">
      <div class="poster num">DONE</div>
      <hr class="rule">
      <div class="head" style="color:#9A2A20;font-size:20px">Recovery required</div>
      <p style="color:var(--dim)">Next session unlocks tomorrow. Protein and sleep are the workout now.</p></div>`+requestsCard();
    return;
  }
  if(!L.revealed && today()<S.date){
    app.innerHTML=connectBanner()+fuelStrip()+sealCard('Sealed','');
    return;
  }
  if(!L.revealed){
    app.innerHTML=connectBanner()+fuelStrip()+sealCard('Today',`<button class="btn accent" onclick="reveal()">Break seal</button>`);
    return;
  }
  const snum=String(idx+1).padStart(3,'0');
  let h=connectBanner()+fuelStrip()+`<div style="display:flex;justify-content:space-between;align-items:center"><div class="label">Session ${snum} · ${S.place.toUpperCase()}</div>${unitBtn()}</div><h1>${S.phase.replace(/^Phase \d+ · /,'')}</h1>`;
  if(S.formCue)h+=`<div class="coach"><div class="label" style="color:#9A2A20">Form focus</div><p>"${S.formCue}"</p></div>`;
  for(const b of S.blocks){
    const bl=L.blocks[b.id]||(L.blocks[b.id]={sets:[],skipped:false});
    h+=`<div class="card block">${howto(b)}<div class="exname">${b.name}</div>
      <div class="label rx">${b.detail}</div>`;
    if(bl.skipped){h+=`<div class="warn">Skipped — carries to next session.</div></div>`;continue}
    if(b.type==='timed'){
      const d=bl.sets[0]||{};
      const M={min:['0:00','TIME (MIN)'],cal:['—','CALORIES'],m:['—','METERS']}[b.metric||'min'];
      h+=`<div class="logrow ${d.done?'done':''}">
        <div class="sn">1</div>
        <div class="grp"><div class="box"><input id="t_${b.id}" inputmode="decimal" placeholder="${M[0]}" value="${d.time??''}"><span>${M[1]}</span></div></div>
        <button class="go" onclick="logTimed('${b.id}')">${d.done?'DONE':'LOG'}</button></div>`;
    }else if(b.type==='measure'){
      const d=bl.sets[0]||{};
      h+=(b.measures||[]).map(m=>`<div class="logrow">
        <div class="sn" style="flex-basis:110px;font-size:12px">${m.label}</div>
        <div class="grp"><div class="box"><input id="m_${b.id}_${m.id}" inputmode="decimal" placeholder="—" value="${d[m.id]??''}"><span>${m.unit||''}</span></div></div></div>`).join('')+
        `<button class="go head" style="border:1px solid var(--line2);padding:12px 18px;margin-top:6px" onclick="logMeasure('${b.id}')">${d.done?'SAVED ✓':'SAVE MEASUREMENTS'}</button>`;
    }else{
      for(let i=0;i<b.sets;i++){
        const d=bl.sets[i]||{};
        const shown=d.w??((d.u&&d.u!==unit())?'':targetIn(b.targetWeight));
        h+=`<div class="logrow ${d.done?'done':''}">
          <div class="sn">${i+1}</div>
          <div class="grp">
            <div class="box"><input id="w_${b.id}_${i}" inputmode="decimal" placeholder="—" value="${shown}"><span>${(d.u||unit()).toUpperCase()}</span></div>
            <div class="box"><input id="r_${b.id}_${i}" inputmode="numeric" placeholder="—" value="${d.r??b.targetReps??''}"><span>REPS</span></div>
          </div>
          <button class="go" onclick="logSet('${b.id}',${i})">${d.done?'DONE':'LOG'}</button></div>`;
      }
    }
    {
      const ups=bl.uploads||[];
      const busy=bl.uploading;
      const rx=!!b.film;
      h+=`<button class="filmbadge" style="${rx?'':'border-color:var(--line2);color:var(--dim)'}" onclick="film('${b.id}')">${rx?'<span class="dot"></span>':'◉ '}${busy?'UPLOADING…':ups.length?`ADD ANOTHER (${ups.length} IN)`:rx?'FILM THIS SET':'FILM / PHOTO'}</button>
        <input type="file" id="f_${b.id}" accept="video/*,image/*" style="display:none" onchange="gotClip('${b.id}',this)">`;
      if(ups.length&&!busy)h+=`<div class="good">${ups.length} in — coach review lands in ~3 min (Review tab).</div>`;
      if(bl.uploadError)h+=`<div class="warn">Last upload failed — NOT saved. Shoot with the Camera app, attach here after.</div>`;
    }
    h+=`<br><span class="skip" onclick="skipBlock('${b.id}')">skip — carry to next session</span></div>`;
  }
  h+=`<div class="card"><div class="exname">Session wrap-up</div>
    <div class="label">RPE — how hard overall</div><div class="scales">${scale('rpe',L.rpe)}</div>
    <div class="label">Feel — mood / energy</div><div class="scales">${scale('feel',L.feel)}</div>
    <div class="label">Notes</div>
    <textarea id="notes" placeholder="Pain points or breakthroughs?">${L.notes||''}</textarea>
    <button class="btn primary" style="margin-top:16px" onclick="finish()">Finish session</button></div>`;
  app.innerHTML=h+requestsCard();
}
function requestsCard(){
  const reqs=j('movereqs',[]);
  return `<div class="card" style="border-style:dotted;background:transparent">
    <div class="label" style="margin-bottom:10px">+ Request a movement</div>
    <div style="display:flex;gap:10px">
      <input id="mreq" style="flex:1;background:transparent;border:none;border-bottom:2px solid var(--line);color:var(--bone);font:15px var(--fbody);outline:none;padding:8px 0" placeholder="e.g. farmer carries, sled pushes">
      <button class="go head" style="border:1px solid var(--line2);padding:0 18px" onclick="sendReq()">Send</button></div>
    ${reqs.map(r=>`<div class="statrow"><span>${r.t}</span><span class="label" style="font-size:11px">${r.d}${r.synced?' · SENT ✓':' · QUEUED'}</span></div>`).join('')}</div>`;
}
async function sendReq(){
  const t=$('mreq').value.trim();if(!t)return;
  const reqs=j('movereqs',[]);
  const r={t,d:today(),synced:false};reqs.push(r);sv('movereqs',reqs);
  const c=cfg();
  if(c){
    const [endpoint,token]=c;
    try{

function weekCount(){
  const now=new Date(); const day=(now.getDay()+6)%7;

  let n=0;

  return n;

function sparkline(vals){
  if(vals.length<2)return '<div class="spark"></div>';
  const w=280,h=50,min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-4-((v-min)/rng)*(h-8)).toFixed(1)}`).join(' ');
  return `<div class="spark"><svg width="100%" height="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="overflow:visible">
    <polyline points="${pts}" fill="none" stroke="#8C1B14" stroke-width="4" opacity=".4" transform="translate(0,2)"/>
    <polyline points="${pts}" fill="none" stroke="#8C1B14" stroke-width="2"/></svg></div>`;
}

      if(!firstKey)firstKey=key;
    }
    if(note){
      await fetch(endpoint+'/upload?key='+encodeURIComponent(group+'/note.txt'),{method:'POST',
        headers:{'Authorization':'Bearer '+token,'Content-Type':'text/plain'},body:note});
    }
    const q=j('mealq',[]);q.push({key:firstKey,date:today()});sv('mealq',q);
    renderFuel();pollMeals();
  }catch(e){alert('Upload failed — try again.')}
}
let mealTimer=null;
function pollMeals(){
  clearInterval(mealTimer);
  mealTimer=setInterval(async()=>{
    if(!j('mealq',[]).length){clearInterval(mealTimer);return}
    if(await checkMealQueue()&&view==='fuel')renderFuel();
  },20000);
}
async function nearMe(){
  const send=async txt=>{
    const c=cfg();if(!c){alert('Connect first (Today tab).');return}
    const [endpoint,token]=c;
    const key=`suggest/${today()}-${Date.now()}.txt`;
    const res=await fetch(endpoint+'/upload?key='+encodeURIComponent(key),{method:'POST',
      headers:{'Authorization':'Bearer '+token,'Content-Type':'text/plain'},body:txt});
    const rj=res.ok?await res.json():null;
    if(rj&&rj.size>0){const q=j('suggestq',[]);q.push({key,date:today()});sv('suggestq',q);renderFuel();pollSuggest()}
    else alert('Request failed — try again.');
  };
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      p=>send(p.coords.latitude.toFixed(5)+','+p.coords.longitude.toFixed(5)),
      ()=>{const t=prompt('Location unavailable — where are you? (e.g. "Town Center VB")');if(t)send(t)},
      {timeout:8000});
  }else{const t=prompt('Where are you?');if(t)send(t)}
}
let sugTimer=null;
function pollSuggest(){
  clearInterval(sugTimer);
  sugTimer=setInterval(async()=>{
    const q=j('suggestq',[]);
    if(!q.length){clearInterval(sugTimer);return}
    const c=cfg();if(!c)return;
    const [endpoint,token]=c;
    try{
      const fb=await fetch(endpoint+'/feedback',{headers:{'Authorization':'Bearer '+token}}).then(r=>r.json());
      const remain=[];
      for(const it of q){
        const f=fb[it.key];
        if(!f){remain.push(it);continue}
        try{
          const m=JSON.parse(f.notes.match(/\{.*\}/s)[0]);
          sv('suggest',{...m,date:it.date});
        }catch(e){}
      }
      sv('suggestq',remain);
      if(view==='fuel')renderFuel();
    }catch(e){}
  },20000);
}
function addFuel(n,g){
  const key='fuel:'+today();const f=j(key,{g:0,items:[]});
  f.items.push({n,g});f.g+=g;sv(key,f);
  postLog({type:'nutrition',date:today(),protein_g:f.g,items:f.items});
  renderFuel();
}
function addCustom(){
  const g=parseInt(prompt('Protein grams?'));if(!g)return;
  const n=prompt('What was it?')||'Custom';
  addFuel(n,g);
}
function rmFuel(i){
  const key='fuel:'+today();const f=j(key,{g:0,items:[]});
  f.g-=f.items[i].g;f.items.splice(i,1);sv(key,f);
  postLog({type:'nutrition',date:today(),protein_g:f.g,items:f.items});
  renderFuel();
}

init();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
