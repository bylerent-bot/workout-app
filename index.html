<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070A0C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Bar Fight">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Bar Fight</title>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  /* IRON CIRCUIT — Arcade Broadcast skin (Codex design-pack 2026-08-03), functionality intact.
     Class contract preserved from v6 so the JS layer keeps working; only the paint changed.
     Tokens per DESIGN_SYSTEM.md. Var names keep their historical ROLES:
     --black = ground (ink-950), --bone = foreground text, --card = cabinet steel,
     --ox = rage/danger + rival, --pine = volt/earned (success). */
  :root{
    --black:#070A0C; --card:#10161A; --raised:#182126; --bone:#F4F7F2; --dim:#8FA3AA;
    --ox:#FF3B30; --pine:#C7FF2E; --line:#34434A; --line2:#26333A; --ctrl:#5E7480;
    --volt:#C7FF2E; --ice:#49C6FF; --gold:#FFCF40; --violet:#B48CFF;
    --fnum:'Barlow Condensed',Impact,sans-serif; --fhead:'Barlow Condensed',Impact,sans-serif;
    --fbody:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif; --fpix:'Press Start 2P','Arial Black',sans-serif;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
  body{margin:0; background:var(--black); color:var(--bone);
    font:16px/1.35 var(--fbody);
    background-image:linear-gradient(rgba(73,198,255,.025) 1px,transparent 1px),linear-gradient(90deg,rgba(73,198,255,.025) 1px,transparent 1px);
    background-size:16px 16px;
    padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:520px; margin:0 auto; padding:20px 16px 110px}
  body.resting .wrap{padding-bottom:300px}
  .num{font-family:var(--fnum); font-weight:900; letter-spacing:.01em; font-variant-numeric:tabular-nums}
  .head{font-family:var(--fhead); font-weight:700; text-transform:uppercase; letter-spacing:.045em}
  .pix{font-family:var(--fpix); font-size:10px; line-height:1.5; color:var(--volt)}
  h1{font-family:var(--fhead); font-weight:900; font-size:32px; text-transform:uppercase; letter-spacing:.02em; margin:4px 0 16px; line-height:1}
  .label{font-family:var(--fhead); font-weight:700; font-size:13px; text-transform:uppercase; letter-spacing:.1em; color:var(--dim)}
  .label.lit{color:var(--bone)}
  .card{position:relative; background:var(--card); border:2px solid var(--line); padding:18px; margin-bottom:16px;
    box-shadow:5px 5px 0 #000; clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
  .rule{border:0; border-top:2px solid var(--line); margin:18px 0}
  .dotted{border:0; border-top:2px dotted var(--line); margin:18px 0}
  button{font:inherit; border:none; border-radius:0; cursor:pointer; color:var(--bone); background:none}
  .btn{display:flex; align-items:center; justify-content:center; width:100%; height:58px;
    border:2px solid var(--line); background:var(--raised); font-family:var(--fhead); font-weight:900; font-size:18px;
    text-transform:uppercase; letter-spacing:.06em; box-shadow:4px 4px 0 #000}
  .btn:active{transform:translate(2px,2px); box-shadow:1px 1px 0 #000}
  .btn.primary{background:var(--volt); border-color:var(--volt); color:var(--black)}
  .btn.accent{background:var(--volt); border-color:var(--volt); color:var(--black)}
  .btn.rival{background:var(--ox); border-color:var(--ox); color:#fff}
  .btn.boss{background:var(--card); border:2px solid var(--violet); color:var(--violet)}
  .btn.small{height:48px; font-size:15px; border:2px solid var(--line); color:var(--dim); box-shadow:3px 3px 0 #000}
  input:focus-visible,textarea:focus-visible{border-bottom-color:var(--ice) !important}
  button:focus-visible,a:focus-visible{outline:3px solid var(--ice); outline-offset:2px}
  .btn+.btn{margin-top:12px}
  /* sealed session = the marquee */
  .sealwrap{text-align:center; padding:12px 0}
  .seal{position:relative; overflow:hidden; border:4px solid var(--volt); background:var(--card); padding:26px 18px 20px; margin:18px 0; box-shadow:7px 7px 0 #000}
  .seal::before{content:''; position:absolute; left:0; right:0; top:0; height:7px;
    background:repeating-linear-gradient(90deg,var(--volt) 0 8px,transparent 8px 16px)}
  .seal .day{font-family:var(--fnum); font-weight:900; font-size:96px; line-height:.95; margin:0; color:var(--volt); text-shadow:5px 5px 0 #000}
  .seal .mon{font-family:var(--fhead); font-weight:900; font-size:26px; text-transform:uppercase; letter-spacing:.08em; margin:2px 0 0}
  .coach{border-left:4px solid var(--ice); background:var(--card); padding:12px 16px; margin:0 0 20px}
  .coach .label{margin-bottom:4px; color:var(--ice)}
  .coach p{margin:0; color:var(--dim); font-size:14px}
  .block .exname{font-family:var(--fhead); font-weight:900; font-size:24px; text-transform:uppercase; color:var(--bone); margin:0 0 4px}
  .block .rx{font:14px/1.45 var(--fbody); color:var(--dim); text-transform:none; letter-spacing:0; margin-bottom:14px}
  .whead{position:sticky; top:0; z-index:15; background:rgba(7,10,12,.97); border-bottom:2px solid var(--line);
    display:flex; justify-content:space-between; align-items:baseline; gap:10px; padding:12px 0; margin:-20px 0 14px;
    font-family:var(--fhead); font-weight:700; font-size:12px; letter-spacing:.08em; text-transform:uppercase}
  .whead .sync.ok{color:var(--volt)} .whead .sync.q{color:var(--gold)}
  .receipt{display:flex; justify-content:space-between; align-items:center; gap:10px; width:100%; text-align:left;
    border:2px solid var(--line); background:var(--card); padding:15px 16px; margin-bottom:8px; min-height:52px;
    font-family:var(--fhead); font-weight:700; font-size:15px; text-transform:uppercase; letter-spacing:.04em; color:var(--dim)}
  .receipt.done{border-color:#40552D; color:var(--bone)}
  .receipt.done .st{color:var(--volt)}
  .receipt .st{font-size:12px; white-space:nowrap}
  .logrow{display:flex; height:66px; border:2px solid var(--line); background:var(--raised); margin-bottom:8px}
  .logrow .sn{flex:0 0 40px; display:flex; align-items:center; justify-content:center; font-family:var(--fhead); font-weight:900; font-size:18px; color:var(--dim)}
  .logrow .grp{flex:1; display:flex; border-left:2px solid var(--line); border-right:2px solid var(--line)}
  .logrow .box{flex:1; position:relative; display:flex; flex-direction:column; justify-content:center}
  .logrow .box+.box{border-left:2px solid var(--line)}
  .logrow .box span{position:absolute; bottom:3px; left:0; width:100%; text-align:center;
    font-family:var(--fhead); font-weight:700; font-size:10px; letter-spacing:.1em; color:var(--dim)}
  .logrow input{background:transparent; border:none; outline:none; color:var(--bone); width:100%;
    font-family:var(--fnum); font-weight:900; font-size:28px; text-align:center; padding-bottom:10px}
  .logrow .go{flex:0 0 72px; font-family:var(--fhead); font-weight:900; font-size:18px; letter-spacing:.04em; background:var(--volt); color:var(--black)}
  .logrow .go:active{transform:translate(1px,1px)}
  .logrow.done{height:48px; border-color:#40552D; opacity:.82; background:var(--card)}
  .logrow.done .sn,.logrow.done .box span{color:var(--dim)}
  .logrow.done input{color:var(--dim); font-size:20px; padding-bottom:10px}
  .logrow.done .go{background:transparent; color:var(--volt); font-size:22px}
  .filmbadge{display:inline-flex; align-items:center; gap:8px; font-family:var(--fhead); font-weight:900; font-size:14px;
    text-transform:uppercase; letter-spacing:.06em; color:var(--ice); background:var(--raised); border:2px solid var(--ice); padding:13px 16px; margin-top:12px; box-shadow:3px 3px 0 #000}
  .filmbadge .dot{width:10px; height:10px; background:var(--ox); border-radius:50%}
  .skip{color:var(--dim); font-size:13px; text-decoration:underline; padding:14px 0; display:inline-block}
  .scales{display:flex; gap:8px; overflow-x:auto; padding:8px 0 10px; scrollbar-width:none}
  .scales::-webkit-scrollbar{display:none}
  .scales button{flex:0 0 52px; height:52px; border:2px solid var(--line); background:var(--raised); font-family:var(--fnum); font-weight:900; font-size:22px; box-shadow:3px 3px 0 #000}
  .scales button.sel{background:var(--volt); color:var(--black); border-color:var(--volt)}
  textarea{width:100%; background:transparent; border:none; border-bottom:2px solid var(--ctrl);
    color:var(--bone); font:16px var(--fbody); padding:8px 0; min-height:56px; resize:none; outline:none}
  /* rest timer — red cabinet drawer */
  .timer{position:fixed; left:0; right:0; bottom:calc(72px + env(safe-area-inset-bottom)); background:var(--card);
    border-top:4px solid var(--ox); padding:16px 20px 18px; display:none; align-items:center; justify-content:space-between; gap:12px; z-index:10; overflow:hidden; box-shadow:0 -10px 0 rgba(0,0,0,.35)}
  .timer.on{display:flex}
  .timer.fin{background:var(--volt); border-top-color:var(--volt)}
  .timer.fin .t,.timer.fin .label{color:var(--black)}
  .timer.fin .drain{display:none}
  .timer .drain{position:absolute; left:0; top:0; height:8px; background:var(--ox); transition:width 1s linear; pointer-events:none}
  .timer .t{font-family:var(--fnum); font-weight:900; font-size:72px; line-height:.95; font-variant-numeric:tabular-nums; text-shadow:4px 4px 0 #000}
  .timer.fin .t{text-shadow:none}
  .timer .tbtn{border:2px solid var(--line); background:var(--raised); color:var(--bone); padding:16px 18px; font-family:var(--fhead); font-weight:900; font-size:15px; text-transform:uppercase; letter-spacing:.06em; position:relative; z-index:1; box-shadow:3px 3px 0 #000}
  .timer .tbtn:active{transform:translate(2px,2px)}
  .fb{border-left:2px solid var(--dim); padding-left:14px; margin-top:12px; font-size:14px; color:var(--dim); white-space:pre-wrap}
  .fbsec{margin-top:12px; border-left:3px solid var(--ox); padding-left:12px}
  .fbsec.keep{border-left-color:var(--volt)}
  .fbsec b{display:block; font-family:var(--fhead); font-weight:700; font-size:12px; letter-spacing:.12em; color:var(--ox); margin-bottom:4px}
  .fbsec.keep b{color:var(--volt)}
  .fbsec p{margin:0; font-size:14px; color:var(--bone); white-space:pre-wrap}
  .pending{font-family:var(--fhead); font-weight:700; font-size:15px; text-transform:uppercase; letter-spacing:.08em; color:var(--gold); margin-top:12px}
  video{width:100%; margin-top:10px; background:#000; border:2px solid var(--line)}
  .poster{font-family:var(--fnum); font-weight:900; font-size:88px; line-height:.9; margin:0; text-shadow:5px 5px 0 #000}
  .poster small{font-family:var(--fhead); font-size:22px; color:var(--dim); letter-spacing:.04em}
  .spark{width:100%; height:56px; border-bottom:2px solid var(--line); margin:18px 0}
  .lb-row{display:flex; align-items:baseline; margin-bottom:12px; font-family:var(--fhead); font-weight:700; font-size:17px; text-transform:uppercase}
  .lb-dots{flex:1; border-bottom:2px dotted var(--line); margin:0 8px; position:relative; top:-4px}
  .lb-val{font-family:var(--fnum); font-weight:900; font-size:22px; color:var(--volt)}
  .statrow{display:flex; justify-content:space-between; align-items:baseline; padding:10px 0; border-bottom:1px dotted var(--line2); font-size:14px}
  .track{width:100%; height:14px; background:var(--line2); border:2px solid var(--line); margin:14px 0 8px}
  .track i{display:block; height:100%; background:var(--gold); transition:width .3s}
  .track.hit i{background:var(--volt)}
  .chips{display:flex; gap:10px; overflow-x:auto; padding:6px 0 12px; scrollbar-width:none}
  .chips::-webkit-scrollbar{display:none}
  .chips button{flex:0 0 auto; border:2px solid var(--line); background:var(--raised); padding:12px 18px;
    font-family:var(--fhead); font-weight:700; font-size:14px; text-transform:uppercase; letter-spacing:.04em; box-shadow:3px 3px 0 #000}
  .chips button:active{transform:translate(2px,2px)}
  .mealrow{display:flex; justify-content:space-between; gap:8px; border-bottom:1px dotted var(--line2); padding:12px 0;
    font-family:var(--fhead); font-weight:700; font-size:14px; text-transform:uppercase; color:var(--dim)}
  .mealrow .g{color:var(--bone); font-family:var(--fnum); font-weight:900; font-size:16px; white-space:nowrap}
  .tabbar{position:fixed; left:0; right:0; bottom:0; height:calc(72px + env(safe-area-inset-bottom)); display:flex;
    background:var(--card); border-top:2px solid var(--line); padding-bottom:env(safe-area-inset-bottom); z-index:20}
  .tabbar button{flex:1; font-family:var(--fhead); font-weight:900; font-size:13px; text-transform:uppercase; letter-spacing:.08em; color:var(--dim); border-right:1px solid var(--line)}
  .tabbar button:last-child{border-right:0}
  .tabbar button.main{flex:1.25; font-size:15px}
  .tabbar button.sel{background:var(--volt); color:var(--black)}
  .warn{color:var(--ox); font-size:13px; margin-top:8px}
  .good{color:var(--volt); font-size:13px; margin-top:8px}
  .cuebox{border-left:3px solid var(--ice); background:var(--card); padding:12px 14px; margin-top:12px; font-size:14px}
  .cuebox b{display:block; font-family:var(--fhead); font-weight:700; font-size:11px; letter-spacing:.12em; color:var(--ice); margin-bottom:6px}
  /* ---- game surfaces ---- */
  .toast{position:fixed; left:50%; top:16%; transform:translate(-50%,0); background:var(--volt); color:var(--black);
    padding:12px 18px; font-family:var(--fhead); font-weight:900; font-size:18px; opacity:0; pointer-events:none; z-index:40}
  .toast.on{animation:score .6s ease-out}
  @keyframes score{0%{opacity:0;transform:translate(-50%,10px)}25%,70%{opacity:1;transform:translate(-50%,0)}100%{opacity:0;transform:translate(-50%,-18px)}}
  .segs{display:grid; grid-template-columns:repeat(3,1fr); border:2px solid var(--line); margin-bottom:14px}
  .segs button{height:48px; border:0; border-right:2px solid var(--line); background:var(--card); color:var(--dim); font-family:var(--fhead); font-weight:900; font-size:14px; letter-spacing:.08em}
  .segs button:last-child{border-right:0}
  .segs .on{background:var(--volt); color:var(--black)}
  .leader{background:var(--card); border:2px solid var(--line); margin-bottom:10px; box-shadow:5px 5px 0 #000}
  .player{display:grid; grid-template-columns:38px 52px 1fr auto; align-items:center; min-height:80px; padding:10px 12px; border-left:5px solid var(--player,#5E7480)}
  .player .rank{font-family:var(--fpix); font-size:10px; color:var(--dim)}
  .avatar{width:44px; height:44px; display:grid; place-items:center; background:var(--player,#5E7480); color:var(--black);
    font-family:var(--fhead); font-weight:900; font-size:18px; clip-path:polygon(0 0,80% 0,100% 20%,100% 100%,20% 100%,0 80%)}
  .pname{padding-left:10px; font-family:var(--fhead); font-weight:900; font-size:22px; line-height:1; text-transform:uppercase}
  .pname small{display:block; font-family:var(--fhead); font-weight:700; font-size:11px; color:var(--dim); letter-spacing:.08em; margin-top:5px; text-transform:uppercase}
  .pts{text-align:right; font-family:var(--fnum); font-weight:900; font-size:36px; line-height:.9; font-variant-numeric:tabular-nums}
  .pts small{display:block; font-family:var(--fhead); font-weight:700; font-size:10px; color:var(--player,#5E7480); letter-spacing:.1em; margin-top:6px}
  .delta{margin:16px 0; padding:13px 14px; background:var(--raised); border-left:4px solid var(--ox); font-family:var(--fhead); font-weight:900; font-size:17px; letter-spacing:.04em; text-transform:uppercase}
  .feed{background:var(--card); border:2px solid var(--line)}
  .event{padding:13px 14px 13px 16px; border-bottom:1px solid var(--line); border-left:4px solid var(--player,#5E7480)}
  .event:last-child{border-bottom:0}
  .event b{font-family:var(--fhead); font-weight:900; font-size:15px; text-transform:uppercase}
  .event small{display:block; margin-top:3px; color:var(--dim); font-size:12px}
  .event strong{color:var(--player,#5E7480)}
  .win{text-align:center; border:3px solid var(--volt); background:var(--card); padding:22px 14px 16px; box-shadow:7px 7px 0 #000;
    clip-path:polygon(0 0,calc(100% - 14px) 0,100% 14px,100% 100%,14px 100%,0 calc(100% - 14px))}
  .win .kicker{font-family:var(--fhead); font-weight:700; font-size:12px; letter-spacing:.16em; color:var(--volt); text-transform:uppercase}
  .win h1{font-size:64px; line-height:.9; margin:8px 0; text-shadow:4px 4px 0 #000}
  .scoregrid{display:grid; grid-template-columns:repeat(3,1fr); border:2px solid var(--line); margin:16px 0; background:var(--card)}
  .scoregrid div{padding:12px 6px; text-align:center; border-right:2px solid var(--line)}
  .scoregrid div:last-child{border:0}
  .scoregrid strong{display:block; font-family:var(--fnum); font-weight:900; font-size:24px; color:var(--bone)}
  .scoregrid small{font-family:var(--fhead); font-weight:700; font-size:10px; letter-spacing:.1em; color:var(--dim); text-transform:uppercase}
  .scoregrid .gain{color:var(--volt)}
  .lreceipt{position:relative; overflow:hidden; background:var(--card); border:3px solid var(--gold); padding:18px; margin-top:16px; box-shadow:6px 6px 0 #000; text-align:left}
  .lreceipt::before{content:"LOADOUT RECEIPT"; display:block; color:var(--gold); font-family:var(--fpix); font-size:10px; line-height:1.5; margin-bottom:12px}
  .object{display:grid; grid-template-columns:44% 1fr; gap:8px; align-items:center; min-height:150px; border-top:2px solid var(--line); border-bottom:2px solid var(--line); padding:12px 0}
  .object img{width:100%; image-rendering:pixelated; filter:drop-shadow(6px 6px 0 #000)}
  .equiv{font-family:var(--fhead); font-weight:900; font-size:20px; text-transform:uppercase; color:var(--dim)}
  .equiv strong{display:block; font-size:42px; line-height:.9; color:var(--gold); margin:7px 0}
  .exact{font-family:var(--fhead); font-weight:700; font-size:13px; letter-spacing:.08em}
  .lchips{display:flex; gap:7px; flex-wrap:wrap; padding-top:12px}
  .lchips span{background:var(--raised); border:1px solid var(--line); padding:7px 9px; font-family:var(--fhead); font-weight:700; font-size:12px; color:var(--dim); text-transform:uppercase}
  .lchips b{color:var(--bone)}
  .talk{margin-top:14px; border-left:4px solid var(--ice); background:var(--raised); padding:11px 13px; font-size:14px; color:var(--bone); text-align:left}
  .talk b{display:block; color:var(--ice); font-family:var(--fhead); font-weight:900; font-size:12px; letter-spacing:.1em; margin-bottom:4px}
  .marquee{position:relative; overflow:hidden; text-align:center; background:var(--card); border:4px solid var(--violet); padding:24px 14px 18px; box-shadow:7px 7px 0 #000; margin-bottom:14px}
  .marquee::before{content:''; position:absolute; left:0; right:0; top:0; height:7px; background:repeating-linear-gradient(90deg,var(--violet) 0 8px,transparent 8px 16px)}
  .marquee .kicker{font-family:var(--fpix); font-size:10px; line-height:1.5; color:var(--violet)}
  .marquee h1{font-size:42px; margin:12px 0 6px}
  .issuer{border-left:5px solid var(--ox); background:var(--card); padding:16px; margin-bottom:14px}
  .issuer .danger{color:var(--ox); font-family:var(--fhead); font-weight:900; font-size:16px; text-transform:uppercase}
  .rowsx{background:var(--card); border:2px solid var(--line); margin:15px 0}
  .rowx{display:grid; grid-template-columns:88px 1fr; gap:10px; padding:12px; border-bottom:1px solid var(--line)}
  .rowx:last-child{border:0}
  .rowx b{font-family:var(--fhead); font-weight:900; font-size:12px; letter-spacing:.1em; color:var(--dim); text-transform:uppercase}
  .rowx span{font-family:var(--fhead); font-weight:700; font-size:15px}
  .subnav{display:flex; gap:8px; overflow-x:auto; padding:2px 0 14px; scrollbar-width:none}
  .subnav::-webkit-scrollbar{display:none}
  .subnav button{flex:0 0 auto; height:44px; padding:0 16px; border:2px solid var(--line); background:var(--card); color:var(--dim); font-family:var(--fhead); font-weight:900; font-size:13px; letter-spacing:.06em; text-transform:uppercase}
  .subnav .on{background:var(--gold); color:var(--black); border-color:var(--gold)}
  @media(prefers-reduced-motion:reduce){
    .toast.on{animation:none;opacity:1}
    .timer .drain{transition:none}
    .track i{transition:none}
  }
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="timer" id="timer">
  <div class="drain" id="tdrain"></div>
  <div style="position:relative;z-index:1"><div class="label lit">Rest</div><div class="t" id="tval">0:00</div></div>
  <div style="display:flex;gap:10px;position:relative;z-index:1">
    <button class="tbtn" onclick="bump30()">+30</button>
    <button class="tbtn" onclick="stopTimer()">Skip</button>
  </div>
</div>
<div class="tabbar" id="tabbar"></div>
<div class="toast" id="toast" role="status"></div>
<script type="module">
  // game engines ride as real modules; the app degrades gracefully if they fail to load
  try{
    const sc=await import('./game/scoring.js'); window.SCORING=sc;
    const bm=await import('./game/benchmarks.js'); window.BENCHTALK=bm;
  }catch(e){/* offline first launch before sw precache — game math waits for next open */}
</script>
<script>
const $=id=>document.getElementById(id);
// escape anything dynamic that rides innerHTML — server/model/user strings are data, not markup
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const safeUrl=u=>{try{const x=new URL(u);return x.protocol==='https:'?x.href:null}catch(e){return null}};
const MONTHS=['JANUARY','FEBRUARY','MARCH','APRIL','MAY','JUNE','JULY','AUGUST','SEPTEMBER','OCTOBER','NOVEMBER','DECEMBER'];
const store={
  get k(){return 'wlog'},
  // corruption guard: every save keeps a second copy; a mangled wlog falls back to it
  load(){
    try{const v=JSON.parse(localStorage.getItem(this.k));if(v&&typeof v==='object')return v}catch(e){}
    try{const b=JSON.parse(localStorage.getItem(this.k+'_bak'));if(b&&typeof b==='object')return b}catch(e){}
    return{};
  },
  save(d){const s=JSON.stringify(d);localStorage.setItem(this.k,s);try{localStorage.setItem(this.k+'_bak',s)}catch(e){/* quota — primary still saved */}}
};
let S=null, ALLSESS=[], log=store.load(), sec=0, tint=null, tTotal=90, view='home';
const DEFAULT_ENDPOINT='https://train-sync.byler-train.workers.dev';

if(location.hash.startsWith('#cfg=')){
  localStorage.setItem('synccfg', location.hash.slice(5));
  history.replaceState(null,'',location.pathname);
}
function cfg(){const c=localStorage.getItem('synccfg');return c?c.split('|'):null}
/* player identity — cached at connect; defaults keep a not-yet-refreshed install on Patrick's plan */
function me(){return j('me',{pid:'patrick',admin:true,name:'Patrick',profile:{}})}
function prof(){return {foodTarget:140,foodFloor:100,age:43,...(me().profile||{})}}
// non-admin uploads live under p/<pid>/ on R2 — build the REAL key client-side so
// feedback lookups (meals, suggest, clips, gear) match what the coach loop sees
function mkey(k){const m=me();return m.admin?k:(k.startsWith(`p/${m.pid}/`)?k:`p/${m.pid}/`+k)}
async function refreshMe(){
  const c=cfg();if(!c)return;
  try{
    const r=await fetch(c[0]+'/me',{headers:{'Authorization':'Bearer '+c[1]}});
    if(r.ok)sv('me',await r.json());
  }catch(e){/* offline — cached identity stands */}
}
function today(){const d=new Date();return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function j(k,f){try{return JSON.parse(localStorage.getItem(k))??f}catch(e){return f}}
function sv(k,v){localStorage.setItem(k,JSON.stringify(v))}

let loadFailed=false;
async function init(){
  loadFailed=false;
  refreshMe();
  let sess=null;
  const c=cfg();
  if(c){ // per-player queue from the worker wins when the coach has published one
    try{
      const r=await fetch(c[0]+'/sessions',{headers:{'Authorization':'Bearer '+c[1]}});
      if(r.ok){const b=await r.json();if(b&&Array.isArray(b.sessions)){sess=b.sessions;sv('sesscache',b.sessions)}}
    }catch(e){}
  }
  if(!sess){
    try{
      const r=await fetch('data/sessions.json?_='+Date.now());
      if(!r.ok)throw new Error(r.status);
      sess=(await r.json()).sessions;
    }catch(e){sess=j('sesscache',null)}
  }
  if(sess)ALLSESS=sess;else{ALLSESS=[];loadFailed=true}
  S=ALLSESS.find(s=>!(log[s.id]&&log[s.id].completed))||null;
  flushOutbox();
  route();
}
function tabbar(){
  const t=[['home','Home'],['today','Train'],['fuel','Fuel'],['rivalry','Rivalry'],['vault','Vault']];
  $('tabbar').innerHTML=t.map(([v,l])=>`<button class="${v==='today'?'main ':''}${view===v?'sel':''}" onclick="view='${v}';route()">${l}</button>`).join('');
}
let VVIEW=localStorage.getItem('vview')||'film'; // vault sub-tab
function route(){tabbar();({home:renderHome,today:render,fuel:renderFuel,rivalry:renderRivalry,vault:renderVault})[view]()}
function renderVault(){
  const sub={film:renderReview,progress:renderProgress,gear:renderGear,trophy:renderTrophy};
  (sub[VVIEW]||renderReview)();
}
function vaultNav(){
  const t=[['film','Film'],['progress','Progress'],['trophy','Trophies'],['gear','Gear']];
  return `<div class="pix" style="padding:6px 0 10px">TRAIN · THE VAULT</div><div class="subnav">${t.map(([v,l])=>`<button class="${VVIEW===v?'on':''}" onclick="VVIEW='${v}';localStorage.setItem('vview','${v}');renderVault()">${l}</button>`).join('')}</div>`;
}

/* ---------- UNITS ---------- */
const KG2LB=2.20462;
function unit(){return localStorage.getItem('unit')||'lb'}
function toggleUnit(){localStorage.setItem('unit',unit()==='lb'?'kg':'lb');route()}
function unitBtn(){return `<button class="skip" style="text-decoration:none;border:2px solid var(--ctrl);padding:12px 14px;font-family:var(--fhead);letter-spacing:.08em" onclick="toggleUnit()">UNITS: ${unit().toUpperCase()}</button>`}
function setLbs(st){const w=parseFloat(st&&st.w);if(!w)return 0;return (st.u==='kg')?w*KG2LB:w}
function both(lbs){if(!lbs)return '—';const kg=lbs/KG2LB;
  return unit()==='kg'?`${Math.round(kg*10)/10} KG · ${Math.round(lbs)} LB`:`${Math.round(lbs)} LB · ${Math.round(kg*10)/10} KG`}
function targetIn(lbs){if(lbs==null)return '';return unit()==='kg'?String(Math.round(lbs/KG2LB*2)/2):String(lbs)}

/* ---------- FUEL STRIP (home) ---------- */
function fuelStrip(){
  const f=j('fuel:'+today(),{g:0,items:[]});
  const T=prof().foodTarget;
  const pct=Math.min(100,Math.round(f.g/T*100));
  return `<div class="card" style="padding:12px 16px;cursor:pointer" onclick="view='fuel';route()">
    <div style="display:flex;justify-content:space-between;align-items:baseline">
      <span class="label lit">FUEL</span>
      <span><span class="num" style="font-size:24px">${f.g}</span><span class="label">/${T}G</span></span></div>
    <div class="track ${f.g>=T?'hit':''}" style="margin:8px 0 2px;height:8px"><i style="width:${pct}%"></i></div></div>`;
}
function howto(b){
  const q=b.howto||('how to '+b.name.replace(/\(.*?\)/g,'').replace(/[—-].*$/,'').trim()+' exercise proper form');
  const url=(b.howto&&safeUrl(b.howto))||'https://www.youtube.com/results?search_query='+encodeURIComponent(q);
  return `<a href="${esc(url)}" target="_blank" rel="noopener" class="label" style="text-decoration:none;border:2px solid var(--ctrl);padding:12px 14px;font-size:11px;float:right">HOW ▸</a>`;
}

function connectBanner(){
  if(cfg())return '';
  return `<div class="card" style="border-color:var(--ox)">
    <div class="warn" style="margin:0 0 10px">NOT CONNECTED — logs stay on this phone; uploads won't work.</div>
    <button class="btn small" onclick="connect()">Connect (paste setup key)</button></div>`;
}
function connect(){
  let v=prompt('Paste your setup key (or the full link)');
  if(!v)return;
  v=v.replace(/["'\s]/g,'');
  if(v.includes('#cfg='))v=v.split('#cfg=')[1];
  let c;
  if(v.includes('|'))c=v;
  else{
    const tok=(v.match(/[a-f0-9]{32,}/i)||[])[0];
    if(!tok){alert('No key in that paste. Paste the whole code you were sent.');return}
    c=DEFAULT_ENDPOINT+'|'+tok;
  }
  const [ep,tok]=c.split('|');
  // /me works for EVERY player — /pull is admin-only and rejected valid friend tokens
  fetch(ep+'/me',{headers:{'Authorization':'Bearer '+tok}}).then(async r=>{
    if(r.ok){localStorage.setItem('synccfg',c);sv('me',await r.json());alert('Connected. You\'re in.');init()}
    else alert('Server rejected that key. Re-copy the whole code and paste it again.');
  }).catch(()=>alert('Can\'t reach the server. Get signal and try again.'));
}

/* ---------- TODAY ---------- */
function sealCard(kicker,btn){
  const d=new Date(S.date+'T12:00');
  return `<div class="sealwrap">
    <div class="label">${kicker}</div>
    <div class="seal">
      <div class="day num">${d.getDate()}</div>
      <div class="mon">${MONTHS[d.getMonth()]}</div>
      <hr class="dotted">
      <div class="label lit">${S.place.toUpperCase()}</div>
      <div class="label" style="margin-top:8px">${S.time.toUpperCase()}</div>
    </div>${btn}</div>`;
}
function render(){
  const app=$('app');
  if(!S){app.innerHTML=connectBanner()+fuelStrip()+(loadFailed
    ?`<div class="sealwrap"><div class="seal"><div class="mon">Can't load sessions</div><hr class="dotted"><div class="label">Offline and nothing cached — reopen with signal.</div></div><button class="btn small" onclick="init()">Retry</button></div>`
    :`<div class="sealwrap"><div class="seal"><div class="mon">Coach is building the next round</div><hr class="dotted"><div class="label">Nothing queued. Enjoy it — it won't last.</div></div></div>`)+adhocCard();return}
  const L=log[S.id]||(log[S.id]={revealed:false,blocks:{},completed:false});
  if(L.completed)return renderDone();
  const idx=ALLSESS.indexOf(S);
  const prev=idx>0?log[ALLSESS[idx-1].id]:null;
  if(prev&&prev.completedAt&&prev.completedAt.slice(0,10)===today()){
    app.innerHTML=connectBanner()+fuelStrip()+`<div class="sealwrap">
      <div class="poster num">DONE</div>
      <hr class="rule">
      <div class="head" style="color:var(--ox);font-size:20px">Recovery required</div>
      <p style="color:var(--dim)">Next round unlocks tomorrow. Protein and sleep are the workout now — don't fuck with the recovery.</p></div>`+adhocCard()+requestsCard();
    return;
  }
  if(!L.revealed && today()<S.date){
    app.innerHTML=connectBanner()+fuelStrip()+sealCard('Sealed','')+adhocCard();
    return;
  }
  if(!L.revealed){
    app.innerHTML=connectBanner()+fuelStrip()+sealCard('Today',`<button class="btn accent" onclick="reveal()">PRESS START</button>`)+adhocCard();
    return;
  }
  const snum=String(idx+1).padStart(3,'0');
  // ---- workout mode: one dominant exercise, everything else collapses to receipt lines ----
  const btotal=b=>(b.type==='timed'||b.type==='measure'||b.type==='check')?1:b.sets;
  const bdone=(b,bl)=>(b.type==='timed'||b.type==='measure'||b.type==='check')?((bl.sets[0]&&bl.sets[0].done)?1:0):bl.sets.filter(s=>s&&s.done).length;
  const bfin=(b,bl)=>bl.skipped||bdone(b,bl)>=btotal(b);
  for(const b of S.blocks)L.blocks[b.id]||(L.blocks[b.id]={sets:[],skipped:false});
  const firstOpen=S.blocks.find(b=>!bfin(b,L.blocks[b.id]));
  const activeId=(EXP&&S.blocks.some(b=>b.id===EXP))?EXP:(firstOpen&&firstOpen.id);
  const exN=S.blocks.length, exI=Math.max(1,S.blocks.findIndex(b=>b.id===activeId)+1);
  const setsLeft=S.blocks.reduce((n,b)=>n+(L.blocks[b.id].skipped?0:btotal(b)-bdone(b,L.blocks[b.id])),0);
  const obq=outbox().length;
  const [syncTxt,syncCls]=!cfg()?['LOCAL ONLY','q']:obq?['QUEUED','q']:['SYNCED','ok'];
  let h=connectBanner()+`<div class="whead">
    <span>SESSION ${snum} · EX ${exI}/${exN} · ${setsLeft} SET${setsLeft===1?'':'S'} LEFT</span>
    <span><span id="whElapsed">${elapsedMin(L)}</span> · <span class="sync ${syncCls}">${syncTxt}</span></span></div>`;
  h+=`<div style="display:flex;justify-content:space-between;align-items:center"><h1 style="margin:0">${esc(S.phase.replace(/^Phase \d+ · /,''))}</h1>${unitBtn()}</div>`;
  if(S.formCue)h+=`<div class="coach" style="margin-top:12px"><div class="label" style="color:var(--ox)">Form focus</div><p>"${esc(S.formCue)}"</p></div>`;
  for(const b of S.blocks){
    const bl=L.blocks[b.id];
    const fin=bfin(b,bl), active=b.id===activeId;
    if(!active){ // collapsed receipt line — tap to expand
      const st=bl.skipped?'SKIPPED':fin?(b.type==='timed'?(bl.sets[0].time||'DONE')+' ✓':`${bdone(b,bl)}/${btotal(b)} ✓`):`${btotal(b)} SET${btotal(b)===1?'':'S'}`;
      h+=`<button class="receipt ${fin&&!bl.skipped?'done':''}" onclick="EXP='${b.id}';render()"><span>${esc(b.name)}</span><span class="st">${esc(st)}</span></button>`;
      continue;
    }
    h+=`<div class="card block">${howto(b)}<div class="exname">${esc(b.name)}</div>
      <div class="rx">${esc(b.detail)}</div>`;
    if(bl.skipped){h+=`<div class="warn">Skipped — coach sees it and reprograms.</div></div>`;continue}
    if(b.type==='timed'){
      const d=bl.sets[0]||{};
      const M={min:['0:00','TIME (MIN)'],cal:['—','CALORIES'],m:['—','METERS']}[b.metric||'min'];
      h+=`<div class="logrow ${d.done?'done':''}">
        <div class="sn">1</div>
        <div class="grp"><div class="box"><input id="t_${b.id}" inputmode="numeric" placeholder="${M[0]}" value="${esc(DRAFTS[`t_${b.id}`]??d.time??'')}" oninput="${(b.metric||'min')==='min'?'timeIn(this)':'draft(this)'}"><span>${M[1]}</span></div></div>
        <button class="go" onclick="logTimed('${b.id}')">${d.done?'✓':'LOG'}</button></div>`;
    }else if(b.type==='measure'){
      const d=bl.sets[0]||{};
      h+=(b.measures||[]).map(m=>`<div class="logrow">
        <div class="sn" style="flex-basis:110px;font-size:12px">${esc(m.label)}</div>
        <div class="grp"><div class="box"><input id="m_${b.id}_${m.id}" inputmode="decimal" placeholder="—" value="${esc(DRAFTS[`m_${b.id}_${m.id}`]??d[m.id]??'')}" oninput="draft(this)"><span>${esc(m.unit||'')}</span></div></div></div>`).join('')+
        `<button class="go head" style="border:2px solid var(--ctrl);padding:12px 18px;margin-top:6px" onclick="logMeasure('${b.id}')">${d.done?'SAVED ✓':'SAVE MEASUREMENTS'}</button>`;
    }else if(b.type==='check'){
      const d=bl.sets[0]||{};
      h+=`<button class="btn ${d.done?'primary':''}" style="${d.done?'':'border-color:var(--ox);color:var(--ox)'}" onclick="logCheck('${b.id}')">${d.done?'DONE ✓':'MARK DONE'}</button>`;
    }else if(b.type==='work'){
      for(let i=0;i<b.sets;i++){
        const d=bl.sets[i]||{};
        const prevSet=i>0?bl.sets[i-1]:null;
        const prevW=(prevSet&&prevSet.done&&(!prevSet.u||prevSet.u===unit()))?prevSet.w:null;
        const shown=DRAFTS[`w_${b.id}_${i}`]??d.w??(prevW??targetIn(b.targetWeight));
        h+=`<div class="logrow ${d.done?'done':''}">
          <div class="sn">${i+1}</div>
          <div class="grp"><div class="box"><input id="w_${b.id}_${i}" inputmode="decimal" placeholder="—" value="${esc(shown)}" oninput="draft(this)"><span>${esc((d.u||unit()).toUpperCase())} · OPTIONAL</span></div></div>
          <button class="go" onclick="logWork('${b.id}',${i})">${d.done?'✓':'LOG'}</button></div>`;
      }
    }else{
      for(let i=0;i<b.sets;i++){
        const d=bl.sets[i]||{};
        const prevSet=i>0?bl.sets[i-1]:null;
        const prevW=(prevSet&&prevSet.done&&(!prevSet.u||prevSet.u===unit()))?prevSet.w:null;
        const shown=DRAFTS[`w_${b.id}_${i}`]??d.w??((d.u&&d.u!==unit())?'':(prevW??targetIn(b.targetWeight)));
        const shownR=DRAFTS[`r_${b.id}_${i}`]??d.r??(prevSet&&prevSet.done?prevSet.r:null)??b.targetReps??'';
        h+=`<div class="logrow ${d.done?'done':''}">
          <div class="sn">${i+1}</div>
          <div class="grp">
            <div class="box"><input id="w_${b.id}_${i}" inputmode="decimal" placeholder="—" value="${esc(shown)}" oninput="draft(this)"><span>${esc((d.u||unit()).toUpperCase())}</span></div>
            <div class="box"><input id="r_${b.id}_${i}" inputmode="numeric" placeholder="—" value="${esc(shownR)}" oninput="draft(this)"><span>REPS</span></div>
          </div>
          <button class="go" onclick="logSet('${b.id}',${i})">${d.done?'✓':'LOG'}</button></div>`;
      }
    }
    {
      const ups=bl.uploads||[];
      const busy=bl.uploading;
      const rx=!!b.film;
      h+=`<button class="filmbadge" style="${rx?'':'background:none;border-color:var(--ctrl);color:var(--dim)'}" onclick="film('${b.id}')">${rx?'<span class="dot"></span>':''}${busy?'UPLOADING…':ups.length?`FILM — ADD ANOTHER (${ups.length} IN)`:rx?'FILM THIS SET':'FILM / PHOTO'}</button>
        <input type="file" id="f_${b.id}" accept="video/*,image/*" style="display:none" onchange="gotClip('${b.id}',this)">`;
      if(ups.length&&!busy)h+=`<div class="good">${ups.length} in — coach review lands in ~3 min (Review tab).</div>`;
      if(bl.uploadError)h+=`<div class="warn">Last upload failed — NOT saved. Shoot with the Camera app, attach here after.</div>`;
    }
    h+=`<br><span class="skip" onclick="skipBlock('${b.id}')">skip — coach reprograms it</span></div>`;
  }
  h+=`<div class="card"><div class="exname">Session wrap-up</div>
    <div class="label">RPE — how hard overall</div><div class="scales">${scale('rpe',L.rpe)}</div>
    <div class="label">Feel — mood / energy</div><div class="scales">${scale('feel',L.feel)}</div>
    <div class="label">Notes</div>
    <textarea id="notes" placeholder="What hurt. What moved.">${esc(L.notes||'')}</textarea>
    <button class="btn primary" style="margin-top:16px" onclick="finish()">Finish session</button></div>`;
  app.innerHTML=h+requestsCard();
}
let EXP=null; // user-expanded block override (cleared on every log action)
function elapsedMin(L){
  if(!L.revealedAt)return '0 MIN';
  return Math.max(0,Math.round((Date.now()-new Date(L.revealedAt))/60000))+' MIN';
}
setInterval(()=>{const el=$('whElapsed');if(el&&S&&log[S.id]&&log[S.id].revealed&&!log[S.id].completed)el.textContent=elapsedMin(log[S.id])},30000);
/* ad-hoc / class work — a day the coach didn't program still counts (engine floor: 20 min) */
function adhocCard(){
  const list=j('adhoc:'+today(),[]);
  return `<div class="card" style="border-style:dotted;background:transparent">
    <div class="label" style="margin-bottom:10px">+ Outside work — class, run, game, anything</div>
    <div style="display:flex;gap:10px">
      <input id="adMin" inputmode="numeric" placeholder="MIN" style="flex:0 0 72px;background:transparent;border:none;border-bottom:2px solid var(--ctrl);color:var(--bone);font-family:var(--fnum);font-weight:900;font-size:20px;text-align:center;outline:none;padding:8px 0">
      <input id="adWhat" style="flex:1;background:transparent;border:none;border-bottom:2px solid var(--ctrl);color:var(--bone);font:16px var(--fbody);outline:none;padding:8px 0" placeholder="e.g. jiu jitsu, 5k, pickup ball">
      <button class="go head" style="border:2px solid var(--ctrl);padding:0 18px;min-height:48px" onclick="logAdhoc()">Log</button></div>
    ${list.map(a=>`<div class="statrow"><span>${esc(a.what)}</span><span class="label" style="font-size:11px">${a.min} MIN${a.synced?' · SENT ✓':' · QUEUED'}</span></div>`).join('')}</div>`;
}
async function logAdhoc(){
  const min=parseInt($('adMin').value);
  if(!min){$('adMin').focus();return}
  const what=$('adWhat').value.trim()||'Outside work';
  const k='adhoc:'+today();
  const list=j(k,[]);list.push({min,what,t:what+'|'+min,synced:false});sv(k,list);
  toastMsg(min>=(window.SCORING?SCORING.T.adhocMinMinutes:20)?'COUNTS AS A SESSION. BANKED.':'LOGGED. SHORT OF A SESSION.');
  route();

}
function requestsCard(){

      <button class="go head" style="border:2px solid var(--ctrl);padding:0 18px;min-height:48px" onclick="sendReq()">Send</button></div>
    ${reqs.map(r=>`<div class="statrow"><span>${esc(r.t)}</span><span class="label" style="font-size:11px">${esc(r.d)}${r.synced?' · SENT ✓':' · QUEUED'}</span></div>`).join('')}</div>`;
}
async function sendReq(){
  const t=$('mreq').value.trim();if(!t)return;
  const reqs=j('movereqs',[]);
  reqs.push({t,d:today(),synced:false});sv('movereqs',reqs);
  render();
  await queuePost('movereq',{sessionId:'movement-request',log:{type:'movement-request',date:today(),request:t}},{store:'movereqs',t});
}
function scale(k,sel){let s='';for(let i=1;i<=10;i++)s+=`<button class="${sel===i?'sel':''}" onclick="pick('${k}',${i})">${i}</button>`;return s}
function pick(k,v){log[S.id][k]=v;store.save(log);render()}
function reveal(){log[S.id].revealed=true;log[S.id].revealedAt=new Date().toISOString();store.save(log);render()}
const DRAFTS={}; // typed-but-not-logged values survive rerenders (film uploads, unit toggles)
function draft(el){DRAFTS[el.id]=el.value}
function logSet(bid,i){
  const bl=log[S.id].blocks[bid];
  const r=$(`r_${bid}_${i}`).value.trim();
  if(!r){$(`r_${bid}_${i}`).focus();return} // no reps = not a set; weight may be blank (bodyweight moves)
  bl.sets[i]={w:$(`w_${bid}_${i}`).value.trim(),u:unit(),r,done:true,at:new Date().toISOString()};
  delete DRAFTS[`w_${bid}_${i}`];delete DRAFTS[`r_${bid}_${i}`];
  const lb=Math.round(setLbs(bl.sets[i])*(parseFloat(r)||0));
  if(lb)toastMsg(`+${lb.toLocaleString()} LB BANKED`);
  EXP=null;store.save(log);autoSync();startTimer(90);render();

function queuePost(kind,body,mark,route){
  const ob=outbox();

  const eid=kind==='session'?'s:'+body.sessionId:kind==='score'?'sc:'+body.day:kind+':'+Date.now()+':'+Math.random().toString(36).slice(2,7);
  const i=ob.findIndex(e=>e.id===eid);

  if(i>=0)ob[i]=entry;else ob.push(entry);

  if(!mark)return;

let flushing=false;
async function flushOutbox(depth=0){
  if(flushing)return;const c=cfg();if(!c)return;
  flushing=true;
  const passStart=Date.now();
  const [endpoint,token]=c;
  try{
    for(const e of outbox()){
      try{
        const res=await fetch(endpoint+(e.route||'/log'),{method:'POST',headers:{'Content-Type':'application/json','Authorization':'Bearer '+token},
          body:JSON.stringify(e.body)});
        if(!res.ok){
          // 4xx = the server will NEVER take this entry — park it so it can't poison the
          // queue forever. 401 excepted (fresh player tokens can lag ~60s in KV). 5xx retries.
          if(res.status>=400&&res.status<500&&res.status!==401){
            sv('outbox_dead',[...j('outbox_dead',[]),{...e,status:res.status,diedAt:Date.now()}].slice(-20));
            sv('outbox',outbox().filter(x=>!(x.id===e.id&&x.v===e.v)));
          }
          continue;
        }
        // remove ONLY the exact version we sent — if Finish replaced this entry mid-flight, the newer snapshot survives
        sv('outbox',outbox().filter(x=>!(x.id===e.id&&x.v===e.v)));
        markSynced(e.mark);
        if(e.body.sessionId&&e.body.log&&e.body.log.completed&&log[e.body.sessionId]){
          log[e.body.sessionId].synced=true;store.save(log);
          if(view==='today')route();
        }
      }catch(err){/* still offline — keep it queued */}
    }
  }finally{flushing=false}
  // work that arrived during the pass gets one immediate follow-up flush
  if(depth<1&&outbox().some(x=>x.v>=passStart))await flushOutbox(depth+1);
}

// Reference weights are round game values, not claims about specific models.
const OBJECTS=[
  ['safe-500','CAST-IRON SAFE','SAFES',500],['piano-700','CONCERT PIANO','PIANOS',700],
  ['vending-900','LOADED VENDING MACHINE','VENDING MACHINES',900],['gold-1000','36 GOLD BARS','GOLD STACKS',1000],
  ['motorcycle-1200','FULL-DRESS TOURING BIKE','TOURING BIKES',1200],['dragster-1800','DRAGSTER','DRAGSTERS',1800],
  ['sedan-3200','SPORT SEDAN','SEDANS',3200],['pickup-4800','FULL-SIZE PICKUP','PICKUPS',4800],
  ['armored-suv-6500','ARMORED SUV','ARMORED SUVS',6500],['container-8500','EMPTY 20-FT CONTAINER','CONTAINERS',8500],
  ['monster-truck-12000','MONSTER TRUCK','MONSTER TRUCKS',12000],['city-bus-28000','CITY BUS','CITY BUSES',28000]

function pickLoadout(vol){ // largest object with vol >= .85w; count 2-9 else promote; greedy mixed tail
  if(!vol||vol<400)return null;
  let pick=null;
  for(const o of OBJECTS)if(vol>=o[3]*0.85)pick=o;
  if(!pick)return null;
  // if count would exceed 9, promote to the next object up when one exists
  let i=OBJECTS.indexOf(pick);
  while(i<OBJECTS.length-1&&vol/OBJECTS[i][3]>9)i++;
  pick=OBJECTS[i];
  const items=[];let rem=vol;
  const n=Math.max(1,Math.floor(rem/pick[3]));
  items.push({o:pick,n});rem-=n*pick[3];
  // one greedy tail object keeps the story honest without absurd decimals (max 3 objects incl. leftover chip)
  for(let k=OBJECTS.indexOf(pick)-1;k>=0&&items.length<2;k--){
    const m=Math.floor(rem/OBJECTS[k][3]);
    if(m>=1){items.push({o:OBJECTS[k],n:m});rem-=m*OBJECTS[k][3];break}
  }
  return {items,leftover:Math.round(rem)};
}

// session streak: consecutive days (ending today or yesterday) whose banked score
// includes a done session (>=250 = the session adherence floor). Food-only doesn't extend it.
function sessionStreak(){
  const scores=j('dayscores',{});
  const hit=d=>(scores[d]||{}).total>=250;
  const d=new Date();
  if(!hit(localDate(d.toISOString())))d.setDate(d.getDate()-1); // today not banked yet ≠ broken
  let n=0;
  while(hit(localDate(d.toISOString()))){n++;d.setDate(d.getDate()-1)}
  return n;
}

// coach notes render as stamped sections when the review uses the KEEP/FIX/WATCH/NEXT headings
function fbHtml(notes){
  const heads={'KEEP':'keep','FIX NEXT SET':'','FIX':'','WATCH':'','NEXT SESSION':'','NEXT':''};
  const re=/^(KEEP|FIX NEXT SET|FIX|WATCH|NEXT SESSION|NEXT)\s*[:—-]\s*/i;
  const lines=String(notes||'').split(/\n/);
  const secs=[];let cur=null;
  for(const ln of lines){
    const m=ln.match(re);
    if(m){cur={h:m[1].toUpperCase(),body:[ln.replace(re,'')]};secs.push(cur)}
    else if(cur)cur.body.push(ln);
  }
  if(secs.length<2)return `<div class="fb">${esc(notes)}</div>`;
  return secs.map(s=>`<div class="fbsec ${s.h==='KEEP'?'keep':''}"><b>${esc(s.h)}</b><p>${esc(s.body.join('\n').trim())}</p></div>`).join('');
}
async function playClip(key,btn){
  btn.textContent='Loading…';
  const [endpoint,token]=cfg();
  try{
    const r=await fetch(endpoint+'/media/'+encodeURIComponent(key),{headers:{'Authorization':'Bearer '+token}});
    if(!r.ok)throw new Error('HTTP '+r.status);
    const blob=await r.blob();
    const v=document.createElement('video');
    v.src=URL.createObjectURL(blob);v.controls=true;v.playsInline=true;
    btn.after(v);btn.remove();v.play();
  }catch(e){btn.textContent='▶ Watch (failed — retry)'}
}

function weekCount(){
  const now=new Date(); const day=(now.getDay()+6)%7;
  const mon=new Date(now); mon.setDate(now.getDate()-day); mon.setHours(0,0,0,0);
  let n=0;
  for(const s of ALLSESS){const L=log[s.id];if(L&&L.completed&&L.completedAt&&new Date(L.completedAt)>=mon)n++}
  return n;
}
function sparkline(vals){
  if(vals.length<2)return '<div class="spark"></div>';
  const w=280,h=50,min=Math.min(...vals),max=Math.max(...vals),rng=(max-min)||1;
  const pts=vals.map((v,i)=>`${(i/(vals.length-1)*w).toFixed(1)},${(h-4-((v-min)/rng)*(h-8)).toFixed(1)}`).join(' ');
  return `<div class="spark"><svg width="100%" height="100%" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" style="overflow:visible">
    <polyline points="${pts}" fill="none" stroke="#8C1B14" stroke-width="4" opacity=".4" transform="translate(0,2)"/>
    <polyline points="${pts}" fill="none" stroke="#8C1B14" stroke-width="2"/></svg></div>`;
}

  let h=vaultNav()+`<h1 style="margin-top:8px">Gear</h1>
  <div class="label" style="margin-bottom:14px">What I'm programming around${eq&&eq.updated?` · AS OF ${esc(eq.updated)}`:''}</div>
  <button class="btn accent" onclick="$('gearIn').click()">+ Snap new gear</button>
  <input type="file" id="gearIn" accept="image/*" multiple style="display:none" onchange="gotGear(this)">
  <div id="gearStatus">${j('gearq',[]).length?'<div class="label" style="margin-top:10px">IN — CLAUDE CATALOGS IT AND STARTS PROGRAMMING WITH IT.</div>':''}</div>
  <div class="card" style="border-style:dotted;background:transparent;margin-top:14px">
    <div class="label" style="margin-bottom:10px">Corrections · new gym · travel spot</div>
    <div style="display:flex;gap:10px">
      <input id="gnote" style="flex:1;background:transparent;border:none;border-bottom:2px solid var(--ctrl);color:var(--bone);font:16px var(--fbody);outline:none;padding:8px 0" placeholder="e.g. joined Iron Asylum · no 60s, they're 55s">
      <button class="go head" style="border:2px solid var(--ctrl);padding:0 18px;min-height:48px" onclick="gearNote()">Send</button></div>
    ${notes.map(n=>`<div class="statrow"><span>${esc(n.t)}</span><span class="label" style="font-size:11px">${esc(n.d)}${n.synced?' · SENT ✓':' · QUEUED'}</span></div>`).join('')}</div>`;
  if(eq&&eq.categories)for(const c of eq.categories){
    h+=`<div class="card"><div class="exname" style="font-size:16px">${esc(c.name)}</div>`+
      c.items.map(it=>`<div class="statrow" style="border-bottom:1px dotted var(--line2)"><span>${esc(it)}</span></div>`).join('')+`</div>`;
  }
  else h+='<div class="card warn">Equipment list didn\'t load — pull to refresh.</div>';
  app.innerHTML=h;
}
async function gotGear(input){
  const files=[...input.files];if(!files.length)return;
  const c=cfg();
  if(!c){alert('Connect first (Today tab).');return}
  const [endpoint,token]=c;
  const note=prompt('What is it / where does it live? (optional)')||'';
  const group=mkey(`gear/${today()}-${Date.now()}`);
  $('gearStatus').innerHTML='<div class="label" style="margin-top:10px">UPLOADING…</div>';
  try{
    for(let i=0;i<files.length;i++){
      const f=files[i];
      const res=await fetch(endpoint+'/upload?key='+encodeURIComponent(`${group}/p${i+1}.${fileExt(f,'jpg')}`),{method:'POST',
        headers:{'Authorization':'Bearer '+token,'Content-Type':f.type||'image/jpeg'},body:f});
      const rj=res.ok?await res.json():null;
      if(!(rj&&rj.size===f.size))throw new Error('fail');
    }
    if(note)await fetch(endpoint+'/upload?key='+encodeURIComponent(group+'/note.txt'),{method:'POST',
      headers:{'Authorization':'Bearer '+token,'Content-Type':'text/plain'},body:note});
    const q=j('gearq',[]);q.push({key:group,date:today()});sv('gearq',q);
    renderGear();
  }catch(e){$('gearStatus').innerHTML='<div class="warn">Upload failed — try again.</div>'}
}
async function gearNote(){
  const t=$('gnote').value.trim();if(!t)return;
  const notes=j('gearnotes',[]);
  notes.push({t,d:today(),synced:false});sv('gearnotes',notes);
  renderGear();
  await queuePost('gearnote',{sessionId:'gear-note',log:{type:'gear-note',date:today(),note:t}},{store:'gearnotes',t});
}

/* ---------- FUEL ---------- */
const MEALS=[
  ['Shake','45'],['RTD Core Power','42'],['CAVA 2x protein','50'],
  ['Panera Cobb','40'],['Steak','50'],['Double burger','45'],
  ['Sushi / poke','40'],['Chicken dinner','40'],['Greek yogurt','18'],['3 eggs','19']
];
function suggestBox(){
  const s=j('suggest',null);
  const pending=j('suggestq',[]).length;
  let h='';
  if(pending)h+=`<div class="label" style="margin-top:12px">SCOUTING NEARBY PROTEIN — PICKS LAND IN ~3 MIN…</div>`;
  if(s&&s.date===today()){
    h+=`<div class="cuebox"><b>NEAR ${esc((s.where||'YOU').toUpperCase())}</b>`+
      (s.picks||[]).map(p=>`<div style="margin-top:10px"><span class="head" style="font-size:15px">${esc(p.spot)}</span> — ${esc(p.order)} <span class="num" style="color:var(--ox)">~${esc(p.protein_g)}G</span></div>`).join('')+`</div>`;
  }
  return h;
}
async function checkMealQueue(){
  const q=j('mealq',[]);const c=cfg();
  if(!q.length||!c)return false;
  const [endpoint,token]=c;
  try{
    const fb=await fetch(endpoint+'/feedback',{headers:{'Authorization':'Bearer '+token}}).then(r=>r.json());
    let changed=false;const remain=[];
    for(const it of q){
      const f=fb[it.key];
      if(!f){remain.push(it);continue}
      try{
        const m=JSON.parse(f.notes.match(/\{.*\}/s)[0]);
        const dk='fuel:'+it.date;const day=j(dk,{g:0,items:[]});
        day.items.push({n:'PHOTO · '+m.desc+(m.note?' — '+m.note:''),g:m.protein_g});
        day.g+=m.protein_g;sv(dk,day);changed=true;
        postLog({type:'nutrition',date:it.date,protein_g:day.g,items:day.items});
      }catch(e){remain.push(it)}
    }
    sv('mealq',remain);
    if(changed)recomputeToday(); // analyzed meal protein just landed
    return changed;
  }catch(e){return false}
}
function renderFuel(){
  if(j('mealq',[]).length){checkMealQueue().then(ch=>{if(ch&&view==='fuel')renderFuel()});pollMeals()}
  if(j('suggestq',[]).length)pollSuggest();
  const key='fuel:'+today();
  const f=j(key,{g:0,items:[]});
  const P=prof(),T=P.foodTarget,FL=P.foodFloor;
  const pct=Math.min(100,Math.round(f.g/T*100));
  let h=`<div class="label" style="margin-top:8px">Daily target: ${T}G protein</div>
  <div style="display:flex;align-items:baseline;gap:6px">
    <div class="poster num">${f.g}</div>
    <span class="num" style="font-size:40px;color:var(--dim)">/${T}</span>
    <span class="head" style="font-size:20px;color:var(--dim)">G</span></div>
  <div class="track ${f.g>=T?'hit':''}"><i style="width:${pct}%"></i></div>
  <div class="label" style="margin-bottom:18px">${f.g>=T?'FUEL LOCKED. STOP EATING LIKE AN INTERN.':f.g>=FL?`PAST THE FLOOR — PUSH TO ${T}.`:`FLOOR IS ${FL}. YOU'RE NOT CLOSE.`}</div>
  <button class="btn primary" onclick="$('mealIn').click()">+ Snap meal / menu</button>
  <button class="btn small" onclick="nearMe()">Find protein near me</button>
  <input type="file" id="mealIn" accept="image/*" multiple style="display:none" onchange="gotMeal(this)">
  ${j('mealq',[]).filter(q=>q.date===today()).map(()=>`<div class="label" style="margin-top:12px">ANALYZING — PROTEIN LANDS IN ~2 MIN…</div>`).join('')}
  <div id="suggestBox">${suggestBox()}</div>
  <div class="label" style="margin:22px 0 6px">Quick add</div>
  <div class="chips">${MEALS.map(([n,g])=>`<button onclick="addFuel('${n}',${g})">${n} <span style="color:var(--pine);font-weight:700">+${g}G</span></button>`).join('')}
    <button onclick="addCustom()">Custom +?</button></div>`;
  if(f.items.length){
    h+=`<h1 style="font-size:24px;margin-top:22px">Today's log</h1>`+
      f.items.map((it,i)=>`<div class="mealrow"><span>${esc(it.n)}</span><span class="g">${esc(it.g)}G <button style="color:var(--dim);font-family:var(--fbody);padding:14px;margin:-14px -8px -14px 0" onclick="rmFuel(${i})">✕</button></span></div>`).join('');
  }
  $('app').innerHTML=h;
}
async function gotMeal(input){
  const files=[...input.files];if(!files.length)return;
  const c=cfg();
  if(!c){alert('Connect first (Today tab) — photo can\'t upload.');return}
  const [endpoint,token]=c;
  const note=prompt('What is it? (optional)')||'';
  const group=mkey(`meals/${today()}-${Date.now()}`);
  try{
    let firstKey=null;
    for(let i=0;i<files.length;i++){
      const f=files[i];
      const key=`${group}/p${i+1}.${fileExt(f,'jpg')}`;
      const res=await fetch(endpoint+'/upload?key='+encodeURIComponent(key),{method:'POST',
        headers:{'Authorization':'Bearer '+token,'Content-Type':f.type||'image/jpeg'},body:f});
      const rj=res.ok?await res.json():null;
      if(!(rj&&rj.size===f.size))throw new Error('upload failed');
      if(!firstKey)firstKey=rj.key||key;
    }
    if(note){
      await fetch(endpoint+'/upload?key='+encodeURIComponent(group+'/note.txt'),{method:'POST',
        headers:{'Authorization':'Bearer '+token,'Content-Type':'text/plain'},body:note});
    }
    const q=j('mealq',[]);q.push({key:firstKey,date:today()});sv('mealq',q);
    renderFuel();pollMeals();
  }catch(e){alert('Upload failed — try again.')}
}
let mealTimer=null;
function pollMeals(){
  clearInterval(mealTimer);
  mealTimer=setInterval(async()=>{
    if(!j('mealq',[]).length){clearInterval(mealTimer);return}
    if(await checkMealQueue()&&view==='fuel')renderFuel();
  },20000);
}
async function nearMe(){
  const send=async txt=>{
    const c=cfg();if(!c){alert('Connect first (Today tab).');return}
    const [endpoint,token]=c;
    const key=mkey(`suggest/${today()}-${Date.now()}.txt`);
    const res=await fetch(endpoint+'/upload?key='+encodeURIComponent(key),{method:'POST',
      headers:{'Authorization':'Bearer '+token,'Content-Type':'text/plain'},body:txt});
    const rj=res.ok?await res.json():null;
    if(rj&&rj.size>0){const q=j('suggestq',[]);q.push({key:rj.key||key,date:today()});sv('suggestq',q);renderFuel();pollSuggest()}
    else alert('Request failed — try again.');
  };
  if(navigator.geolocation){
    navigator.geolocation.getCurrentPosition(
      p=>send(p.coords.latitude.toFixed(5)+','+p.coords.longitude.toFixed(5)),
      ()=>{const t=prompt('Location unavailable — where are you? (e.g. "Town Center VB")');if(t)send(t)},
      {timeout:8000});
  }else{const t=prompt('Where are you?');if(t)send(t)}
}
let sugTimer=null;
function pollSuggest(){
  clearInterval(sugTimer);
  sugTimer=setInterval(async()=>{
    const q=j('suggestq',[]);
    if(!q.length){clearInterval(sugTimer);return}
    const c=cfg();if(!c)return;
    const [endpoint,token]=c;
    try{
      const fb=await fetch(endpoint+'/feedback',{headers:{'Authorization':'Bearer '+token}}).then(r=>r.json());
      const remain=[];
      for(const it of q){
        const f=fb[it.key];
        if(!f){remain.push(it);continue}
        try{
          const m=JSON.parse(f.notes.match(/\{.*\}/s)[0]);
          sv('suggest',{...m,date:it.date});
        }catch(e){}
      }
      sv('suggestq',remain);
      if(view==='fuel')renderFuel();
    }catch(e){}
  },20000);
}
function addFuel(n,g){
  const key='fuel:'+today();const f=j(key,{g:0,items:[]});
  f.items.push({n,g});f.g+=g;sv(key,f);
  postLog({type:'nutrition',date:today(),protein_g:f.g,items:f.items});
  recomputeToday(); // fuel moves the day score — plan hit, rest-day food points
  renderFuel();
}
function addCustom(){
  const g=parseInt(prompt('Protein grams?'));if(!g)return;
  const n=prompt('What was it?')||'Custom';
  addFuel(n,g);
}
function rmFuel(i){
  const key='fuel:'+today();const f=j(key,{g:0,items:[]});
  f.g-=f.items[i].g;f.items.splice(i,1);sv(key,f);
  postLog({type:'nutrition',date:today(),protein_g:f.g,items:f.items});
  recomputeToday(); // server keeps the day's max — a removal can't lower a banked score
  renderFuel();
}

init();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js');
</script>
